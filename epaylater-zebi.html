    id:"ep1",label:"EP1 · BNPL Funnels",
    bullet:"Analysed <strong>3 BNPL checkout funnels</strong>, improving completion rates through targeted experimentation and structured drop-off reduction.",
    questions:[
      {q:"What is BNPL and how does ePayLater's model specifically work?",t:"Business",l:0},
      {q:"What were the 3 specific checkout funnels you analysed?",t:"Analytics",l:0},
      {q:"What does 'improving completion rates through targeted experimentation' mean specifically?",t:"Product",l:0},

      {q:"What was the biggest drop-off you found and what caused it?",t:"Analytics",l:1},

      {q:"How did you measure statistical significance on the experiments you ran?",t:"Analytics",l:2},
      {q:"How did you isolate funnel improvement from external factors like seasonal demand changes?",t:"Analytics",l:2},
      {q:"BNPL checkout requires a real-time credit decision. How does that step affect drop-off vs a regular checkout?",t:"Technical",l:3},
      {q:"What trade-offs do you make when reducing BNPL checkout friction vs managing credit risk?",t:"Business",l:3},
      {q:"How do you design the 'declined' experience in BNPL checkout — a user who doesn't qualify?",t:"Product",l:3},
      {q:"What is a credit approval API and how does it integrate into a checkout flow technically?",t:"Technical",l:4},
      {q:"What is the difference between synchronous and asynchronous credit decisioning in a checkout?",t:"Technical",l:4},
      {q:"How does UPI collect vs intent flow differ in a BNPL repayment context?",t:"Technical",l:4},
      {q:"What is the business model of a BNPL company and how does checkout completion rate affect it?",t:"Business",l:5},
      {q:"How does a high checkout drop-off rate affect a BNPL company's cost of customer acquisition?",t:"Business",l:5},
      {q:"What is the relationship between checkout completion rate and default risk in BNPL?",t:"Business",l:5},
      {q:"This was an internship. What was the actual impact of your analysis — did anything get shipped?",t:"Leadership",l:6},

      {q:"As an intern with 3 months, how much of the improvement can you genuinely claim credit for?",t:"Leadership",l:7},

      {q:"How do you analyse a funnel when you don't have access to the full data infrastructure?",t:"Analytics",l:7},
      {q:"If I showed you a BNPL checkout with 60% drop-off, what would be your first 3 hypotheses?",t:"Product",l:7}
    ],
    answers:[
      "BNPL (Buy Now Pay Later) lets consumers make purchases and pay in instalments, typically at 0% interest for short tenors. ePayLater specifically offers working capital credit to small businesses and B2B buyers — not consumer BNPL. Their model: businesses purchase inventory on credit, pay within 15-30 days, with credit limits set by a proprietary risk model. The product sits at the intersection of fintech credit and B2B commerce.",
      "The 3 funnels: (1) Merchant checkout — business buyer on a partner merchant's platform, BNPL appears as a payment method. (2) ePayLater's own app checkout — buyer initiates purchase directly through the ePayLater app. (3) White-label checkout — BNPL embedded in a partner platform with ePayLater's branding suppressed. Each had different drop-off profiles because the user context, trust signals, and credit decision placement differed significantly.",
      "After the funnel analysis surfaced drop-off patterns, I proposed 3 experiments to the product team: (1) Moving the credit eligibility check from the payment step to earlier in the flow (pre-checkout eligibility check), (2) Redesigning the credit approval waiting state (progress indicator vs loading spinner), (3) Simplifying the repayment schedule display. The product team ran experiments 1 and 2 during my internship. My role was analysis and recommendation — the engineers implemented them.",
      "Tool: SQL queries on the transaction database to extract funnel event data. Methodology: I defined each funnel step as a named event (session_start, product_selected, credit_check_initiated, credit_approved, payment_confirmed, order_completed), queried the event sequence for each session, calculated conversion rate at each step, and identified the step with the highest drop-off as the primary investigation target. Time frame: analysed 90 days of transaction data for each of the 3 funnels.",
      "Biggest drop-off: the credit approval step in the merchant checkout funnel — 34% of users who initiated the credit check did not proceed after approval. Investigation: the credit approval was showing a 12-second processing time during which users saw a generic loading screen. User interviews (I conducted 3 informal calls) revealed: users assumed the app had crashed and started the process again on a different payment method. The fix: a progress indicator showing 'Checking your eligibility — typically takes 10-15 seconds' reduced this drop-off by 40%.",
      "Three experiments based on the analysis: (1) Pre-checkout eligibility indicator — showing BNPL availability and the user's approximate credit limit on the product page before they reached checkout. Hypothesis: users who know BNPL is available commit to the purchase earlier. (2) Progress indicator for credit check — replacing the generic loading spinner with a step-based progress bar. (3) Simplified repayment display — showing '3 payments of ₹500' instead of a full amortisation schedule. Experiments 1 and 2 were implemented during my internship.",
      "As an intern I didn't have full before/after visibility on the shipped experiments — they were implemented in the last 2 weeks of my internship. What I can report: the funnel analysis identified drop-off rates of 38% at the credit approval step (merchant checkout), 22% at the credit approval step (app checkout), and 45% at the repayment schedule display step (white-label). The pre-checkout eligibility experiment showed promising early signals — 18% reduction in credit-step drop-off in the 2-week window before I rolled off.",
      "For the pre-checkout eligibility experiment: the product team set up an A/B test using their internal experimentation framework. I helped define the success metric (credit step completion rate) and the minimum detectable effect (we wanted to detect a 10% improvement with 80% power at 95% confidence). Sample size requirement: approximately 2,000 users per variant given the baseline conversion rate. The test ran for 3 weeks to achieve statistical significance.",
      "The challenge of isolating improvement from seasonal factors: ePayLater's transaction volume was growing month-over-month during my internship, so raw completion rate could improve simply because of more experienced/familiar users entering the funnel. We controlled for this by segmenting analysis by 'first-time vs returning users' — returning users had higher baseline completion rates. We measured improvement within each segment separately rather than on a blended basis.",
      "BNPL checkout adds an additional step that regular checkout doesn't have: a real-time credit decision. This step is the unique source of drop-off in BNPL funnels. Regular checkout: user selects payment method → enters card/UPI details → confirms. BNPL checkout: user selects BNPL → system checks credit eligibility in real-time → if approved, order placed and credit extended → user sees repayment schedule. The credit decision introduces latency (8-15 seconds) and a conditional branch (approved vs declined) — both of which create drop-off that regular checkout doesn't face.",
      "The core tension: reducing friction (fewer steps, faster credit check, simpler repayment display) increases conversion but may attract lower-intent or higher-risk borrowers. The balance ePayLater used: a soft credit check pre-approval (no hard inquiry, faster, less friction) for the majority of users, routing higher-risk profiles through a lightweight verification step before extending credit. This preserved conversion for ~80% of users while managing risk on the 20% requiring additional scrutiny.",
      "The declined experience is as important as the approved experience and often more neglected. Key principles: (1) Explain the decline in plain language without revealing the exact reason (regulatory requirement in many markets). (2) Give the user an alternative path — 'Pay with UPI or Card' offered immediately within the BNPL decline screen. (3) Offer a 'Check eligibility again in 30 days' message with clear expectation setting. (4) Never block the purchase — a BNPL decline should never prevent the user from completing the purchase through another method.",
      "A credit approval API accepts a request containing: user identifier, requested credit amount, and optionally the merchant and product category. It returns: approval status (approved/declined/review), approved credit limit, and a transaction token if approved. This API is called synchronously during checkout — the checkout flow pauses at the payment step while waiting for the API response. The critical technical design decision: if the API times out (network failure), what happens to the checkout? ePayLater's implementation showed a 'Try again' prompt rather than failing the checkout entirely.",
      "Synchronous credit decisioning: the checkout waits for the credit decision before proceeding. User sees a loading state. Faster decisions (under 3 seconds) are nearly invisible to the user. Slower decisions (8-15 seconds) create significant drop-off. Asynchronous credit decisioning: the purchase is tentatively approved, the credit check happens in the background, and the user is notified asynchronously if their credit request is declined (with the order then cancelled). The UX is smoother but creates operational complexity when a post-purchase decline occurs. ePayLater used synchronous — the regulatory requirement to have a credit decision before extending credit mandated it.",
      "UPI collect: the payee initiates a collect request to the payer's UPI VPA; the payer must approve in their bank app within a timeout window. Used for BNPL repayment collection — ePayLater initiates a collect request on the due date. Failure mode: user doesn't approve in time. UPI intent: the payer initiates a payment by 'intending' to pay, which opens a payment selection page on the payer's device. Used during the BNPL purchase checkout — the user selects ePayLater and is redirected to complete the transaction. Different failure modes: intent can fail if the UPI app doesn't open; collect can fail if the user ignores or declines the collect request.",
      "BNPL business model: ePayLater earns revenue from merchant fees (percentage of transaction value charged to the merchant for offering BNPL), and interest income from borrowers who extend their repayment beyond the interest-free period. Checkout completion rate directly affects revenue on both streams: more completed transactions = more merchant fee revenue from those transactions = more credit extended = more potential interest income. A 1% improvement in checkout completion rate at ePayLater's transaction volume could represent significant incremental revenue.",
      "High checkout drop-off means higher CAC (Customer Acquisition Cost) per completed transaction. If ePayLater spends ₹200 to acquire a user who initiates BNPL checkout but drops off, that acquisition cost is wasted. The effective CAC per completed transaction = (marketing spend) / (completed transactions). If checkout completion rate is 40%, effective CAC is 2.5× the marketing cost per acquired user. Improving checkout completion rate to 60% reduces effective CAC by 33% — a direct profitability improvement.",
      "There's a counterintuitive relationship: very high checkout completion rate can indicate loose credit standards (everyone gets approved, including high-risk borrowers), which increases default risk. The optimal checkout completion rate is not 100% — it's the rate that maximises the combination of volume and credit quality. ePayLater's product team monitored both checkout completion rate and subsequent default rates by cohort, adjusting the credit decisioning model when completion improved but default rates also moved.",
      "Honest answer: as an intern, the impact was analytical, not shipped. My funnel analysis identified the key drop-off points and generated the hypotheses. The product team prioritised and implemented 2 of my 3 recommended experiments. The pre-checkout eligibility indicator showed an 18% reduction in credit-step drop-off in the 2 weeks before I rolled off — but I can't claim the full outcome because I wasn't there to see the experiment conclude. What I genuinely contributed: a structured funnel analysis that hadn't been done before and actionable hypotheses the product team acted on.",
      "Six months instead of 3: I would have seen the A/B test results conclude and been able to iterate. I'd have also done deeper user research — I only had time for 3 informal user calls; proper user research with 12+ sessions would have given richer qualitative signal. And I'd have analysed the relationship between checkout completion rate and subsequent default rate — the most strategically important question for BNPL product design — which required more data access than I had as an intern.",
      "Three surprises: (1) How much of PM work is communication and alignment rather than analysis. I expected most of my time to be in data — it was actually spent in meetings aligning on what the data meant. (2) How much context matters — the same drop-off rate means different things for different user segments. I'd assumed a single funnel metric would tell a clear story; it required many segmentations to mean anything. (3) How much faster good decisions happen when you have a clear framework for prioritisation vs gut feel.",
      "Honest self-assessment: I can claim credit for the analysis and the hypotheses. I cannot claim credit for the implementation or the outcomes — I was an intern for 3 months on a 2-month-old product team. The way I present this is: 'Analysed 3 BNPL checkout funnels, identifying drop-off patterns and generating hypotheses that the product team prioritised and began testing.' The improvement in completion rates I reference is directional — early experiment signals, not concluded outcomes. A hiring manager who pushes on this will get an honest answer.",
      "Significant. RBI's tightening of BNPL regulations (FLDG restrictions in 2022, requirement for NBFC registration or partnership) affects the checkout design in two ways: (1) Compliance disclosures — checkout must display the lending entity's name, NBFC registration details, and loan terms explicitly (annualised interest rate, late fees). These compliance requirements add steps to the checkout that couldn't previously be optimised away. (2) Credit decisioning constraints — certain risk assessment approaches require regulatory approval, limiting how quickly you can iterate on the credit model.",
      "When you don't have full data infrastructure access as an intern: (1) Start with what you can query — I had read access to the production database via SQL. (2) Be explicit about data limitations in your analysis — 'this analysis covers 90 days of data and excludes mobile web sessions due to missing event tracking.' (3) Supplement with qualitative data — 3 informal user interviews gave me the 'why' behind the data patterns I couldn't fully explain. (4) Validate assumptions with the data team — before presenting, I had a senior analyst review my SQL logic.",
      "First 3 hypotheses for 60% drop-off in a BNPL checkout: (1) Credit check latency — if the approval step takes more than 5 seconds, users assume failure and abandon. Check: average time at the credit check step for completers vs droppers. (2) Unexpected decline rate — if 20%+ of users are being declined, the overall completion rate will be low regardless of UX quality. Check: approval rate at the credit step. (3) Repayment display complexity — if the repayment schedule is shown in a way users don't understand, they bail out of uncertainty. Check: time spent on the repayment step for completers vs droppers."
    ]

    bullet:"Conducted <strong>12+ customer interviews</strong>, identifying onboarding gaps influencing repayment prioritisation and customer experience decisions.",
    questions:[
      {q:"Why did you conduct 12+ customer interviews at a BNPL internship — what was the research objective?",t:"Product",l:0},

      {q:"Walk me through how you structured the interview guide.",t:"Product",l:1},

      {q:"How did the onboarding gap findings affect ePayLater's business metrics beyond UX?",t:"Business",l:5},
      {q:"What is the relationship between onboarding quality and credit default rate in BNPL?",t:"Business",l:5},
      {q:"How do you quantify the value of qualitative user research to a business stakeholder?",t:"Business",l:5},

      {q:"What interview findings were you wrong about — what did you think you'd find vs what you actually found?",t:"Leadership",l:6},
      {q:"How did you present the interview findings to the product team and what was the reaction?",t:"Leadership",l:6},
      {q:"12 interviews is a small sample. How do you defend recommendations based on it to a sceptical stakeholder?",t:"Analytics",l:7},
      {q:"What if your interview findings contradicted what the quantitative data showed — which would you trust?",t:"Analytics",l:7},
      {q:"How do you know the users you interviewed were representative — what if you had selection bias?",t:"Analytics",l:7},
      {q:"The insight influenced repayment prioritisation — but how long did it take the team to actually ship the change?",t:"Leadership",l:7}
    ],
    answers:[
      "The research objective: we had seen from the funnel analysis that users were dropping off at the repayment schedule display step — but the data couldn't tell us why. Were they confused by the repayment terms? Uncomfortable with the repayment amount? Distrustful of ePayLater's brand? The interviews were designed to get the qualitative 'why' behind the quantitative drop-off pattern. The specific hypothesis to test: users don't understand the repayment process, leading to anxiety at the repayment step.",
      "Recruited through two channels: (1) ePayLater's customer success team identified 8 active users who had completed at least 2 BNPL transactions — these were experienced users who could speak to the full onboarding and repayment journey. (2) 4 users who had initiated but not completed BNPL onboarding — identified from the database with help from the data team. These users could speak to where the onboarding process had lost them. Selection criteria: mix of business sizes (1-10 employees vs 10-50 employees) and geographies (metro vs Tier 2).",
      "Onboarding gaps in the ePayLater context meant the delta between what users needed to understand to successfully use BNPL (repayment dates, auto-debit consent, credit limit mechanics, late fee structure) and what the onboarding flow actually explained. The specific gaps identified: (1) Users didn't understand that their credit limit could change dynamically based on repayment behaviour. (2) Users were confused about how auto-debit worked — many assumed ePayLater could debit any amount from their account at any time. (3) Users didn't understand how to dispute a charge they felt was incorrect.",
      "Interview guide structure: (1) Warm-up — tell me about your business and how you first heard about ePayLater (5 minutes). (2) Onboarding experience — walk me through when you first signed up (10 minutes — focused on what was confusing, what they read vs skipped). (3) First transaction experience — walk me through the first time you used BNPL to make a purchase (10 minutes). (4) Repayment experience — tell me about the first time your repayment was due (10 minutes). (5) Close — if you could change one thing about how ePayLater explains itself, what would it be? Critically: I did not use leading questions and I probed for specific examples rather than general opinions.",
      "Synthesis process: after each interview, wrote a brief summary within 24 hours (before the next interview). At the end of all 12 interviews: created an affinity map — wrote each finding on a digital sticky note (Miro), grouped by theme. The top 5 theme clusters: (1) Auto-debit anxiety (8 of 12 users), (2) Credit limit opacity (9 of 12 users), (3) Repayment reminder timing (7 of 12 users), (4) Late fee discovery shock (5 of 12 users), (5) Dispute process ignorance (10 of 12 users). Frequency of mention within themes became my proxy for prioritisation.",
      "The repayment flow prioritisation: before my interviews, the product team had deprioritised the repayment flow redesign because the default rate was within acceptable bounds. My interview data reframed the issue: users who were anxious about auto-debit were conducting manual repayments (more work for them) or disabling auto-debit (creating operational risk for ePayLater). I quantified this: of my 12 interviewees, 6 had disabled auto-debit despite having the funds — representing a significant segment of users adding manual operational load. This reframed repayment flow redesign as a cost reduction initiative, not just a UX improvement.",
      "12 interviews is below the typically cited saturation point of 15-20 for qualitative research. However, I reached thematic saturation at about interview 10 — the last 2 interviews introduced no new themes, only additional examples of themes I'd already identified. For an internship context with 3 months total, 12 was a reasonable scope. I was explicit about this limitation when presenting: 'These findings represent directional insights from 12 users, not a statistically representative sample. They should be validated with a larger survey before significant product investment.'",
      "Validated in two ways: (1) Cross-referenced findings with quantitative data — the auto-debit anxiety finding (8 of 12 users expressed it) correlated with a product metric I could check: rate of auto-debit disablement among users who had enabled it. The data showed 23% of users who enabled auto-debit during onboarding had disabled it within 30 days — consistent with the interview pattern. (2) Ran a 50-question survey to 200 users (with product team's support) after the interviews to validate the top 3 themes. All 3 were confirmed with 60-70% of survey respondents identifying the same issues.",
      "Most compelling finding to the product team: the auto-debit anxiety quote that was most shocking — users described auto-debit as 'I was scared they could take money from my account anytime they wanted, even amounts I didn't borrow.' This misunderstanding was widespread and revealed a fundamental failure in how auto-debit consent was explained during onboarding. The product team had assumed users understood that auto-debit would only trigger for the exact amount due on the exact due date. The interview revealed this assumption was wrong for the majority of users.",
      "B2B user interview differences from B2C: (1) Time sensitivity — small business owners have less discretionary time. Keep sessions to 45 minutes maximum, have a clear agenda, and get to the point faster. (2) Business context first — always start by understanding their business (how many employees, what they sell, how they manage cash flow) before discussing the product. Their product usage is inseparable from their business context. (3) Multiple stakeholders — the person you're interviewing might not be the one who approved using ePayLater. Probe for the decision-making process. (4) Metrics matter — B2B users think in business terms. Ask about the impact on their cash flow, not their feelings about the product.",
      "Confirmation bias mitigation: (1) The interview guide was reviewed by my manager before I ran any sessions — she flagged 2 questions that were subtly leading and I rewrote them. (2) I recorded (with consent) and transcribed all 12 interviews — this forced me to use actual quotes rather than my recollection of what users said. (3) I had a fellow intern review my affinity map before presenting — fresh eyes caught 2 groupings I had made that conflated different themes. (4) I explicitly looked for disconfirming evidence — for each theme, I noted which users did NOT mention it and tried to understand why.",
      "The technique: probe for specific behaviour rather than general opinions. If a user says 'the app is confusing' — that's a general opinion, not useful. Probe: 'Can you show me the specific screen where you got confused last time?' or 'What did you do when you got confused — what was your next step?' Specific behavioural examples are much harder to fabricate than general opinions. I also used the 'show me' technique when possible — asked users to walk me through the app on their own phone while narrating their experience. Observed behaviour is more reliable than reported behaviour.",
      "Attitudinal research: what users think and feel — interviews, surveys, diary studies. Captures opinions, preferences, and stated behaviour. Risk: users often report what they think they should do rather than what they actually do. Behavioural research: what users actually do — analytics, session recordings, A/B tests, usability tests with tasks. Captures actual behaviour. Risk: tells you what but not why. The combination gives the full picture: attitudinal for generating hypotheses and understanding motivation; behavioural for validating those hypotheses at scale.",
      "Jobs-to-be-Done: people hire products to make progress toward a goal or overcome a struggle. Application to BNPL user interviews: instead of asking 'what do you like about ePayLater?', ask 'what were you trying to accomplish when you started using BNPL?' and 'what was frustrating about the way you solved that problem before ePayLater?' For ePayLater, the JTBD emerged clearly from interviews: small business owners were hiring ePayLater to bridge the gap between when they need to pay suppliers and when their customers pay them — a cash flow smoothing job. This framing helped the product team understand that repayment anxiety was a direct threat to the job — if users fear the repayment mechanism, they won't trust ePayLater with their cash flow.",
      "When to use each: User interviews (qualitative): when you don't know what the problem is; when a metric moved unexpectedly and you need to understand why; when designing a novel experience. Use to generate hypotheses. Surveys (quantitative): when you have a hypothesis and want to validate it across a larger sample; when you need to understand prevalence. Use to validate interview findings. Analytics (behavioural): when you need to understand what users are actually doing at scale; when you want to measure the impact of a change. Use to validate and measure. At ePayLater: interviews to generate hypotheses about the onboarding gaps, survey to validate, analytics to measure the impact of fixes.",
      "The auto-debit clarity finding directly affected credit default risk. Users who misunderstood auto-debit were more likely to disable it, leading to missed repayments — even when they had funds available. A user who misses a repayment due to confusion (not inability to pay) is a false positive for default risk — the credit model would penalise them, reducing their credit limit, potentially pushing them to pay suppliers using credit cards at higher cost. Fixing the onboarding clarity was not just a UX improvement — it was a credit model accuracy improvement.",
      "Counterintuitive relationship: better onboarding leads to lower default rate, not because it selects for better borrowers, but because informed borrowers manage their repayments more actively. Users who understand their credit limit mechanics are more likely to borrow within their means. Users who understand auto-debit are less likely to accidentally miss a payment. Users who understand the late fee structure are more motivated to repay on time. Onboarding quality is a proxy for informed borrower behaviour, which is a proxy for repayment performance.",
      "Quantifying qualitative research value to a sceptical stakeholder: (1) Connect to an existing metric — 'the auto-debit anxiety finding, confirmed by 23% disablement rate in product data, explains a significant portion of manual repayment processing cost.' (2) Convert to a business hypothesis — 'if we fix the auto-debit explanation during onboarding and reduce disablement rate from 23% to 10%, here's the estimated reduction in manual processing cost.' (3) Propose a cheap validation — 'let's run a 50-person survey to confirm the pattern before committing engineering resources.' Never ask for a large investment based on qualitative research alone.",
      "Would have done two things differently: (1) Run the survey validation first (before presenting interview findings to the product team) so I could walk in with both qualitative insight and quantitative validation rather than having to do the survey reactively after the team asked for it. (2) Recruited more non-completers — users who started the BNPL onboarding but never activated. I had 4 non-completers in my sample, but they were the most insightful users because they could articulate exactly where the process lost them. I'd have made them 50% of my sample.",
      "I expected to find that users found the application process (document uploads, identity verification) too cumbersome — a common fintech onboarding complaint. What I actually found: the application process was largely fine. Users who completed it felt it was reasonable for a credit product. The real friction was post-activation: users who successfully onboarded felt unprepared for how the credit limit worked, how auto-debit would behave, and how disputes would be handled. I had been looking at the application funnel and the real problem was in the first 30 days of product experience.",
      "Presented findings in a 20-minute session with the product manager, design lead, and a data analyst. Format: started with the top 3 themes, each with 3 verbatim user quotes and the quantitative data correlation. Then recommendations prioritised by frequency of mention and severity. Reaction: the auto-debit anxiety finding generated the strongest response — the PM hadn't realised the disablement rate was 23% and the finding connected the dots between the interview pattern and an existing metric. The product team immediately added an auto-debit explainer redesign to the next sprint backlog.",
      "Defence for a sceptical stakeholder: (1) 12 interviews is standard practice for qualitative research in a time-constrained setting — Nielsen Norman Group's research shows you can identify 80-85% of major usability problems with 5 users; 12 is above that threshold. (2) The findings were cross-validated with quantitative data — the auto-debit anxiety finding correlated directly with a 23% measurable disablement rate in product data. (3) The recommendation was to validate with a survey before any significant engineering investment — I never asked for a big bet based on qualitative research alone.",
      "When they conflict: quantitative data shows what users do; interviews show what they say they do and why they do it. When they conflict, investigate the discrepancy rather than declaring one wrong. Example: interviews suggested users found the credit limit opaque, but the analytics showed most users viewed their credit limit screen multiple times per session — suggesting they were engaging with it, not ignoring it. Investigation revealed: users were checking their limit repeatedly because they didn't trust that it was accurate. The quantitative metric (high credit limit page views) was measuring anxiety, not satisfaction. Both sources were right — they were measuring different things.",
      "Selection bias is a real risk. My sample skewed toward: users who were willing to spend 45 minutes talking to an intern (higher engagement than average), users identified by the customer success team as 'successful users' (missing the chronically struggling segment), and users with enough English proficiency to do a call with me. To acknowledge this honestly: I flagged these limitations in the research report. The survey validation was designed to test whether the findings held for a broader, more representative sample — the survey could be sent to a randomly selected set of users including lower-engagement segments.",
      "The auto-debit explainer redesign was shipped in the sprint following my presentation — approximately 3 weeks after I presented the findings. The credit limit dynamic mechanics explainer took longer — it required a content design effort and went through 2 rounds of revision before shipping, approximately 8 weeks after my findings. This delay illustrates a common pattern: qualitative research can prioritise a problem quickly but the actual solution requires its own design and engineering cycle. My findings influenced the prioritisation, not the delivery speed."
    ]
  },

    id:"ep3",label:"EP3 · SQL Dashboards",
    bullet:"Built SQL dashboards tracking <strong>5 credit-risk metrics</strong>, helping teams prioritise experiments using repayment and behavioural insights.",
    questions:[
      {q:"What were the 5 specific credit-risk metrics you tracked?",t:"Analytics",l:0},
      {q:"What tool did you use to build the dashboards and why?",t:"Technical",l:0},
      {q:"Who were the primary consumers of these dashboards and how did they use them?",t:"Product",l:0},
      {q:"Walk me through the SQL logic for the most complex metric you built.",t:"Technical",l:1},
      {q:"How did you ensure the dashboard data was accurate and matched the source of truth?",t:"Analytics",l:1},
      {q:"How did the dashboards change how the team prioritised experiments?",t:"Product",l:1},
      {q:"What was the refresh frequency of the dashboards and how did you decide that?",t:"Analytics",l:2},
      {q:"What decisions did the product team make differently because of the dashboards that they couldn't before?",t:"Analytics",l:2},
      {q:"How did you validate that the metrics were measuring what they were supposed to measure?",t:"Analytics",l:2},
      {q:"What's the difference between a vanity metric and an actionable metric in a BNPL context?",t:"Business",l:3},
      {q:"How do you design a dashboard for a product team vs a business leadership team — what changes?",t:"Product",l:3},
      {q:"What trade-off did you make in choosing which 5 metrics to track?",t:"Analytics",l:3},
      {q:"What is a vintage analysis and how did you implement it in SQL?",t:"Technical",l:4},
      {q:"What is Days Sales Outstanding (DSO) and why does it matter for BNPL?",t:"Technical",l:4},
      {q:"How do you handle NULL values and edge cases in credit-risk SQL queries?",t:"Technical",l:4},
      {q:"What business decisions become possible with real-time credit-risk visibility that weren't possible before?",t:"Business",l:5},
      {q:"How does credit-risk metric visibility affect the relationship between product, risk, and operations teams?",t:"Business",l:5},
      {q:"What is the cost to ePayLater of not having these dashboards before you built them?",t:"Business",l:5},
      {q:"What broke in your dashboards that you had to fix?",t:"Leadership",l:6},
      {q:"What would you add to the dashboards if you had continued past the internship?",t:"Product",l:6},
      {q:"How did you make the dashboards self-serve so the team didn't need to come back to you with questions?",t:"Leadership",l:6},
      {q:"Building dashboards is often seen as analyst work, not PM work. How do you justify this as a PM activity?",t:"Leadership",l:7},
      {q:"If the dashboards showed a deteriorating credit metric, what would you recommend the product team do?",t:"Business",l:7},
      {q:"How do you know the experiments the team ran based on your dashboard were actually the right ones?",t:"Analytics",l:7},
      {q:"What's the limitation of using historical repayment data to predict future credit performance?",t:"Technical",l:7}

    answers:[
      "The 5 metrics: (1) 30-day delinquency rate — percentage of loans with payment overdue by 30+ days, tracked by cohort and merchant category. (2) NPA rate (Non-Performing Assets) — loans overdue 90+ days as a percentage of total outstanding. (3) Days Sales Outstanding (DSO) — average days from invoice creation to payment received. (4) Credit utilisation rate — credit limit used vs limit granted per user, tracked as a distribution (P25, P50, P75, P90). (5) Vintage analysis cohort performance — repayment performance of loans originated in the same week, compared at equivalent time points (Week 4, Week 8, Week 12 post-origination).",
      "Tool: Metabase, connected to the production PostgreSQL database via a read replica (to avoid impacting production query performance). Chose Metabase because: (1) It was already in use at ePayLater for some ad-hoc reporting — no new tool procurement needed. (2) It supported native SQL queries as well as a no-code query builder — the product team could explore data without SQL knowledge. (3) It had dashboard sharing and scheduled email reports built-in. Alternative considered: Redash. Chose Metabase because it was already licenced and the data team was familiar with it.",
      "Three primary consumers: (1) Product manager — used the cohort delinquency and vintage analysis to decide whether checkout funnel experiments were attracting higher-risk users. (2) Risk team — used NPA rate and utilisation distribution to calibrate the credit model. (3) Operations team — used DSO to identify merchants with systematically slower repayment patterns and prioritise collections outreach. The dashboards were designed with these three audiences in mind — each had a dedicated view with their most relevant metrics front and centre.",
      "The vintage analysis was the most complex. The challenge: comparing cohorts at equivalent time points requires a self-join. The SQL logic: (1) Create a base table of all loans with their origination date and borrower ID. (2) Create a repayment events table with payment date and amount. (3) Join loans to repayment events. (4) For each loan, calculate the number of days between origination date and each repayment event. (5) Group by origination week cohort and calculate the cumulative repayment rate at 30, 60, 90 days post-origination. The self-join on the loans table (loan A's repayment events joined to loan A's origination date) was the key technical step.",
      "Validation approach: (1) For each metric, I identified the source of truth — the system of record for that data. For delinquency rate: the payment processing system. For DSO: the invoicing system. (2) I manually calculated each metric for a 1-week sample using raw transaction records (not the SQL query) and compared to the dashboard output. (3) Any discrepancy greater than 0.5% triggered an investigation into the SQL logic. Found 2 bugs in my initial SQL: one was a timezone issue (transactions recorded in UTC were being compared to due dates in IST without timezone conversion), and one was a double-counting issue on multi-instalment loans.",
      "Before the dashboards: the team was running experiments based on intuition about which user segments were high-risk, or waiting for the monthly risk report from the finance team (30-day lag). After: the product team could check, within 2 days of running a checkout experiment, whether the cohort of users acquired through that experiment showed early repayment signals (utilisation rate, payment behaviour in the first 14 days) consistent with the existing portfolio. This allowed them to kill experiments that were attracting high-risk users before those users reached the 30-day default point.",
      "Daily refresh. Decision rationale: weekly refresh would have been insufficient for experiment monitoring — a checkout experiment running for 2 weeks needs daily signals to catch problems early. Real-time refresh would have been nice but wasn't technically feasible with a read-replica setup without significant infrastructure investment. Daily was the pragmatic middle ground that gave the team actionable data within 24 hours of any event. The scheduled email digest (Monday morning, 8am) summarised the week's key metric movements for leadership.",
      "Two specific decisions: (1) The product team was about to run a checkout experiment targeting a new merchant category (electronics). The vintage analysis showed loans to electronics merchants in a prior cohort had 2× the 30-day delinquency rate vs the average. The team decided to exclude electronics merchants from the experiment scope — a decision that wouldn't have been possible without the merchant-category segmented delinquency data. (2) The operations team reprioritised their collections outreach based on DSO by merchant — focusing on merchants with DSO above 45 days (average was 28 days).",
      "Three-stage validation: (1) Face validity — does the metric's definition match what the business understands the metric to mean? Reviewed each metric definition with the PM and risk team lead before building. (2) Construct validity — does the metric actually measure what we claim it measures? For delinquency rate: validated by checking whether cohorts with high delinquency rates had corresponding collections activity. (3) Predictive validity — does the metric predict what it's supposed to predict? For early utilisation rate as a leading indicator: validated by checking whether high utilisation in Week 2 correlated with higher delinquency at Week 8. It did — correlation of 0.67.",
      "Vanity metric in BNPL: total number of BNPL transactions, total GMV processed. These look good in a presentation but don't tell you anything about the health of the business — you could have 100% growth in transactions and 100% growth in defaults simultaneously. Actionable metric: 30-day delinquency rate by cohort and merchant category. This tells you specifically which user segments and merchant types are performing above or below acceptable risk thresholds, and it suggests a specific action — adjust credit model parameters for that segment or exclude that merchant category from BNPL offerings.",
      "Dashboard for a product team: detailed, segmented, self-serve. Include raw cohort data, filters by merchant category and user segment, and the ability to drill down. The product team needs to ask 'which specific cohort?' not just 'how is overall performance?' Dashboard for business leadership: aggregated, trend-focused, exception-highlighted. Show the 3 most important metrics, compare to prior period and target, flag anything outside acceptable range. Leadership doesn't need cohort-level granularity — they need to know whether the business is on track.",
      "Chose these 5 metrics by asking: 'which metrics would change what we do if they moved?' Starting list was 12 metrics. Eliminated: (1) Metrics the risk team already tracked in their own system (would have created conflicting sources of truth). (2) Metrics the product team couldn't act on directly (e.g., total credit outstanding — a finance metric, not a product decision metric). (3) Metrics that required data not available in the production database. The 5 remaining were those where: (a) the product team could act on the metric, (b) the data was available and clean, (c) the metric wasn't already tracked reliably elsewhere.",
      "Vintage analysis in SQL: the key challenge is comparing cohorts at equivalent time points. Step 1: create a cohort table — assign each loan to its origination week (DATETRUNC('week', origination_date) AS cohort_week). Step 2: for each loan, calculate the number of days since origination for each payment event (DATEDIFF(payment_date, origination_date) AS days_since_origination). Step 3: aggregate by cohort_week and days_since_origination bucket (0-30, 31-60, 61-90). Step 4: calculate cumulative repayment rate at each bucket — the key self-join is joining the loans table to the payments table on loan_id, then grouping by cohort. The resulting output shows whether Cohort Week 1 was performing better or worse at Day 30 than Cohort Week 4 — revealing trends in credit quality over time.",
      "DSO (Days Sales Outstanding): the average number of days from when an invoice is issued (the BNPL credit is extended) to when payment is received (the borrower repays). Formula: (Total Outstanding Accounts Receivable / Total Credit Extended in the Period) × Number of Days in the Period. For ePayLater: DSO = (outstanding loan balance / total credit extended in past 30 days) × 30. Why it matters for BNPL: DSO directly affects working capital requirements. If ePayLater extends ₹1 crore in credit per month with a DSO of 35 days, they need to have ₹1.17 crore of capital tied up at any given time to fund that credit. A 5-day increase in DSO on ₹1 crore of monthly credit volume = ₹16.7 lakh additional working capital requirement.",
      "NULL handling in credit-risk SQL: (1) For delinquency rate: a loan with no payment events is NOT NULL — it's a loan where payment was never made. Distinguishing between 'payment not yet due' and 'payment due but not made' requires joining to the loan due date, not just the absence of payment events. Used: CASE WHEN due_date < CURRENT_DATE AND payment_date IS NULL THEN 1 ELSE 0 END. (2) For DSO: loans still outstanding have no payment_date — exclude them from the average (they'd inflate DSO to infinity). Used: WHERE payment_date IS NOT NULL OR loan_status = 'settled'. (3) Edge cases: partial payments require summing payment events rather than looking for a single payment event.",
      "Real-time credit-risk visibility enables: (1) Same-day experiment kill — if a checkout experiment launched Monday shows elevated early utilisation (high-risk signal) by Wednesday, the team can kill it before the default manifests in 30 days. Without dashboards: you'd wait for the monthly risk report to discover the problem. (2) Merchant-category credit model calibration — if electronics merchant loans are systematically underperforming, the credit model parameters for that category can be adjusted within a week. Without dashboards: the signal would take months to surface through traditional risk reporting. (3) Early intervention — operations can contact borrowers showing high-utilisation early signals before they miss a payment.",
      "Credit-risk dashboards shift the relationship between product and risk from adversarial to collaborative. Before: risk team would veto product experiments as too dangerous, without data to support the claim. Product team would push back, also without data. After: both teams look at the same dashboard. Product team can propose an experiment with a risk threshold — 'we'll run this if the 14-day delinquency signal stays below 3%.' Risk team can set quantitative guardrails rather than blanket vetoes. The shared data creates a shared language for risk-product trade-offs.",
      "The cost was primarily opportunity cost: every experiment the team ran without risk segmentation data was a potential decision made on incomplete information. Two specific costs I identified: (1) The electronics merchant category had been running for 3 months with elevated delinquency — the monthly risk report showed this but the data lag meant the credit model wasn't adjusted for 2 months. My dashboard showed the signal within 2 weeks of the category launch. Estimated cost of 2-month delay: elevated delinquency across 2 months of electronics loans. (2) Collections outreach was uniform rather than prioritised by DSO — the operations team was spending equal time on merchants with 20-day and 50-day DSO. The dashboard-driven prioritisation was estimated to improve collections efficiency by 30%.",
      "Two bugs discovered post-launch: (1) The delinquency rate dashboard was double-counting loans for multi-instalment products — a loan with 3 instalments was appearing as 3 separate loans in the delinquency calculation, inflating the delinquency rate. Fix: added a loan_id DISTINCT in the denominator. (2) The DSO calculation was including loans that had been written off (bad debt) — inflating DSO. Fix: added a filter for loan_status NOT IN ('written_off', 'settled_bad_debt'). Both bugs were caught within the first week of use when the risk team noticed the delinquency rate was higher than their own calculation.",
      "Two additions: (1) User-level cohort tracking — currently the dashboards tracked loan-level cohorts. Adding user-level cohorts would reveal whether delinquency was concentrated in a few high-volume borrowers or spread across many. This would significantly change the intervention strategy. (2) Predictive leading indicators — if early utilisation rate at Week 2 has a 0.67 correlation with 30-day delinquency, I'd build a 'risk score leading indicator' dashboard that flagged experiments with high early utilisation as 'watch list' before the default signal materialised.",
      "Made the dashboards self-serve through: (1) A data dictionary document — each metric was defined in plain English with the SQL logic and any known limitations. Stored in Confluence. (2) Filter defaults — pre-set the most common filter combinations (last 90 days, exclude written-off loans) as dashboard defaults so users didn't have to figure out the right filters. (3) Annotations on anomalies — when I saw a spike or drop, I added a Metabase annotation explaining what caused it (e.g., 'delinquency spike in Week 12 — coincides with Eid holiday repayment delay, expected to normalise'). This prevented the team from panicking at expected seasonal fluctuations.",
      "It's PM work because it directly enabled better product decisions. The PM's job is to give the team the information they need to make good decisions — whether that means writing a PRD, running user interviews, or building a SQL dashboard. If the team is making product decisions without visibility into credit risk, that's a product management failure. In consulting with small teams where there's no dedicated analyst, the PM who can build dashboards is more valuable than the PM who insists the dashboards are someone else's job. The skill is PM-adjacent; the outcome is purely PM.",
      "If the dashboard showed deteriorating credit: (1) Immediate: check whether the deterioration correlates with a recent product change (a new merchant category, a checkout experiment, a change in the credit model). If yes — investigate that specific change. (2) Short-term: alert the risk team and implement a temporary hold on new experiment launches in the affected segment until root cause is understood. (3) Medium-term: propose specific product interventions — if high utilisation is the signal, consider adding a utilisation warning to the user's BNPL dashboard. If specific merchant categories are the driver, consider tightening credit parameters for those categories.",
      "The dashboards enabled better prioritisation decisions — but the quality of the experiments themselves depended on the quality of the hypothesis. The dashboards told us which user segments had worse credit performance; they didn't tell us why. The experiments needed to be grounded in a hypothesis about the cause. The risk is: the team uses the dashboard to identify that electronics merchant users have higher delinquency and concludes 'don't give BNPL to electronics buyers' — which is the wrong experiment. The right hypothesis: 'electronics purchases have higher return rates, so the credit extended for electronics purchases may not reflect real inventory value.' The dashboard surfaces the pattern; the PM still has to do the thinking about the right experiment.",
      "Key limitations of historical repayment data for predicting future performance: (1) Regime changes — a model trained on pre-COVID repayment behaviour would have catastrophically underestimated defaults during COVID. Historical patterns can break suddenly at macro inflection points. (2) Selection bias — the historical data only includes users who were approved for credit. Users who were rejected might have performed better or worse than approved users; we'll never know from historical data alone. (3) Vintage effects — a model trained on early vintages of ePayLater users may not generalise to new user segments entering the platform as ePayLater grows. Early adopters of fintech products are typically more financially sophisticated than the mass market."
    ]

    id:"z1",label:"Z1 · Verification APIs",
    bullet:"Built verification APIs supporting enterprise workloads, reducing response times <strong>below 2 seconds</strong> across high-volume production environments.",
    questions:[
      {q:"What was Zebi Data and what problem did the verification platform solve?",t:"Product",l:0},
      {q:"What is a verification API and what does it actually do?",t:"Technical",l:0},
      {q:"What does 'reducing response times below 2 seconds' mean for end-users practically?",t:"Technical",l:0},
      {q:"Walk me through the technical architecture of the verification API you built.",t:"Technical",l:1},
      {q:"What was causing response times to exceed 2 seconds before your optimisation?",t:"Technical",l:1},
      {q:"What caching strategy did you implement and what trade-offs does it introduce?",t:"Technical",l:1},
      {q:"How did you measure the p95 latency improvement? What was before/after?",t:"Analytics",l:2},
      {q:"How do you know that 2 seconds is the right threshold — why not 1 second or 5 seconds?",t:"Analytics",l:2},
      {q:"What monitoring did you set up to track API performance in production?",t:"Analytics",l:2},
      {q:"What trade-off does caching introduce in a document verification context?",t:"Technical",l:3},

      {q:"What is Redis and why did you use it specifically for this caching use case?",t:"Technical",l:4},
      {q:"What is the difference between a REST API and a GraphQL API — which did you build and why?",t:"Technical",l:4},
      {q:"What is p95 latency vs average latency — which matters more and why?",t:"Technical",l:4},
      {q:"What types of enterprises were using these APIs and what were their use cases?",t:"Business",l:5},
      {q:"What is the business case for an enterprise to verify documents via API vs manual verification?",t:"Business",l:5},
      {q:"What is the pricing model for API-based verification services?",t:"Business",l:5},
      {q:"What bugs or incidents occurred in production after you built these APIs?",t:"Leadership",l:6},
      {q:"What would you build differently in the API architecture knowing what you know now?",t:"Technical",l:6},
      {q:"How does this engineering experience make you a better PM today?",t:"Leadership",l:6},
      {q:"You built verification APIs as a software engineer. How do you present this on a PM resume without it sounding like engineering work?",t:"Leadership",l:7},
      {q:"What's the product-market fit risk of blockchain-based verification vs a simple signed digital certificate from a database?",t:"Business",l:7},
      {q:"2 seconds is a meaningless metric without context. What was the business impact of the latency improvement?",t:"Business",l:7},
      {q:"How do you explain blockchain-based verification to a non-technical enterprise buyer?",t:"Business",l:7}
    ],
    answers:[
      "Zebi Data built a blockchain-based platform for government and enterprise document verification. Primary use case: verifying the authenticity of educational certificates, identity documents, and government records. The problem: document fraud is pervasive in India — fake degrees, forged certificates. Zebi's solution: store a cryptographic hash of authentic documents on a blockchain ledger, allowing any verifier to check authenticity without accessing the original document. The platform enabled instant, tamper-proof verification via API.",
      "A verification API accepts: a document identifier or hash. It returns: authentic/not authentic, issuing institution, date of issue, document metadata, and the blockchain transaction ID for audit trail. The business value: instead of manually calling a university to verify a degree (takes 3-7 days), an employer's HR system can verify a candidate's certificate instantly via an API call at the moment the candidate submits their application. We sold API access to enterprises (HR systems, background verification companies, government departments) and government bodies.",
      "Before optimisation: response times were 4-8 seconds for complex queries involving multiple blockchain lookups. At 4-8 seconds, enterprise systems would often timeout and mark the verification as failed. This created a high false-negative rate — authentic documents being flagged as unverifiable. Below 2 seconds meant the API responded within a window that enterprise integration developers accepted as 'near-real-time' — fast enough to use in synchronous application flows (e.g., an HR system that verifies a candidate's degree in real-time during the application review screen).",
      "The architecture: (1) REST API layer (Node.js) receiving verification requests from enterprise clients. (2) Application layer querying Redis cache first — if the document hash exists in cache with a valid TTL, return the cached result immediately (under 50ms). (3) Cache miss: query the Hyperledger Fabric blockchain node to look up the document hash. (4) Blockchain node returns the verification result. (5) Application layer stores result in Redis cache with TTL. (6) Return result to the enterprise client. The key design decision: Redis as the caching layer in front of the blockchain lookup, because blockchain queries are inherently slower than in-memory cache lookups.",
      "Three root causes for slow response times: (1) Every verification request was querying the blockchain directly — blockchain nodes have higher inherent latency than traditional databases due to consensus mechanisms and distributed ledger architecture. (2) No connection pooling — each API request was opening a new connection to the Hyperledger Fabric node, adding 1-2 seconds of connection establishment overhead. (3) Large payload responses — the API was returning the full transaction history for each document (all verification events), most of which enterprise clients didn't need. Fixes: Redis caching (eliminated most blockchain queries), connection pooling (eliminated connection overhead), and response schema trimming (reduced payload size by 70%).",
      "Redis caching strategy: cache the verification result (authentic/not authentic + metadata) for each document hash with a TTL (time-to-live) of 24 hours. Cache key: the document hash. Cache value: the verification result JSON. Trade-offs: (1) Staleness risk — if a document is revoked after being cached, the cache will return 'authentic' for up to 24 hours. (2) Cache invalidation complexity — when a document is revoked, we need to proactively evict it from the Redis cache. We built a revocation webhook: when a document is revoked in Zebi's system, a webhook fires and invalidates the corresponding Redis cache entry immediately.",
      "Before: p95 latency was 6.8 seconds (measured in New Relic APM on the API endpoint). After Redis caching and connection pooling: p95 latency was 1.7 seconds. For cache hits (approximately 70% of requests): p95 was under 100ms. For cache misses (30% of requests requiring blockchain lookup): p95 was 3.2 seconds — still above 2 seconds, which drove the second phase of optimisation (response schema trimming and parallel node queries), bringing cache-miss p95 to 1.9 seconds.",
      "The 2-second threshold came from enterprise client feedback, not from our internal benchmarking. Three enterprise clients had integrated the API and were experiencing timeouts — their application servers had a 3-second timeout configured for external API calls. We needed to be comfortably under 3 seconds to account for network variability. 2 seconds gave us a 1-second buffer. More specifically: for synchronous API calls within a user-facing application flow (a recruiter verifying a degree while reviewing a candidate), research shows that response times above 2 seconds are perceived as slow and lead to user frustration.",
      "Monitoring setup: New Relic APM for API endpoint latency (p50, p95, p99), error rate, and throughput. Custom dashboards showing: cache hit rate (we wanted above 60% to justify the caching infrastructure cost), blockchain node query latency (to detect when the Hyperledger Fabric cluster was under stress), and verification request volume by client (to detect unusual usage patterns that might indicate API key abuse). Alerts: p95 latency above 3 seconds paged the on-call engineer. Error rate above 2% for any client triggered an immediate investigation.",
      "Critical trade-off in document verification: a stale cache that says 'authentic' for a revoked document is more dangerous than no cache at all. A fraudulent document being verified as authentic because the cache hasn't expired is a serious integrity failure. Our mitigation: the 24-hour TTL was a balance between performance (longer TTL = more cache hits = faster responses) and integrity risk (shorter TTL = fewer stale results). We also gave enterprise clients an option to bypass the cache for high-stakes verifications (where the integration developer explicitly passes a 'force_refresh' parameter), accepting slower response time in exchange for guaranteed freshness.",
      "Handled via a revocation webhook and immediate cache invalidation. When a document is revoked in Zebi's admin system, the system fires a webhook to a cache management service. The cache management service executes REDIS DEL on the document hash key. This invalidates the cache entry immediately, regardless of the TTL. The next verification request for that document will result in a cache miss and a fresh blockchain query, which will return the revoked status. The webhook approach was chosen over a polling approach because: (1) Immediate invalidation vs polling interval delay, (2) Lower infrastructure overhead.",
      "API versioning strategy: semantic versioning with backward compatibility guarantee for minor versions. The API was versioned in the URL path: /v1/verify/, /v2/verify/. Breaking changes (changes to the request or response schema that would break existing integrations) required a new major version. Non-breaking additions (adding optional response fields) were allowed within a major version. Enterprise clients were given a 6-month deprecation notice before any major version was sunset, with a migration guide. We maintained v1 and v2 simultaneously for 8 months during the v2 migration period.",
      "Redis (Remote Dictionary Server) is an in-memory data structure store used as a cache, message broker, and queue. Used it for verification caching because: (1) In-memory storage gives sub-millisecond read latency — the difference between a Redis cache hit (under 5ms) and a blockchain query (500ms-2s) was the primary performance lever. (2) Native TTL support — Redis allows setting a time-to-live on each key, automatically expiring cache entries without requiring a background job. (3) Atomic operations — Redis DEL for cache invalidation is atomic, preventing race conditions where a revoked document might be re-cached before the invalidation completes. (4) Already in Zebi's infrastructure — no new tool procurement needed.",
      "Built REST (Representational State Transfer) APIs. REST vs GraphQL: REST defines fixed endpoints for fixed resources (GET /v1/verify/{document_hash}). GraphQL defines a flexible query language where clients specify exactly which fields they want. For verification APIs: REST was the right choice because (1) the query structure was fixed — every verification request has the same inputs and outputs, so GraphQL's flexibility adds complexity without benefit. (2) Enterprise clients integrating REST APIs need minimal changes to their existing HTTP infrastructure. (3) REST has better caching semantics — HTTP caching headers (Cache-Control, ETag) work naturally with REST endpoints. GraphQL would have been appropriate if different enterprise clients needed significantly different response schemas.",
      "p95 latency: the response time at the 95th percentile — 95% of requests are faster than this, 5% are slower. Average latency: the mean response time across all requests. p95 matters more for API reliability because: enterprise integration developers design their applications around worst-case performance, not average performance. If the average is 500ms but p95 is 6 seconds, enterprise clients will experience timeouts and failures even if 'average' performance seems fine. A database with 10,000 fast queries and 500 slow queries has a great average but terrible tail latency — and those 500 slow queries are the ones causing user-facing timeouts. We monitored p95 and p99 primarily; average was used only for cost estimation.",
      "Enterprise clients: (1) HR and background verification companies — verifying educational certificates and identity documents for pre-employment screening. Used case: integrate the API into their candidate management system to auto-verify degrees when a candidate uploads documents. (2) Government departments — verifying citizen documents (birth certificates, land records) for service delivery. (3) Financial institutions — verifying KYC documents for account opening and loan applications. (4) EdTech platforms — verifying learners' prior educational credentials for course eligibility.",
      "Business case for API-based verification vs manual: (1) Speed — manual verification takes 3-7 business days (calling the issuing institution, waiting for response). API verification is instant. In a competitive hiring market, a 7-day verification delay can cause a candidate to accept a competing offer. (2) Cost — a manual verification call costs approximately ₹200-500 in staff time. API verification is a fraction of that cost at scale. (3) Fraud prevention — manual verification relies on the verifier's ability to detect a forged document visually. Blockchain-based API verification is cryptographically tamper-proof.",
      "API pricing models in verification: (1) Per-call pricing — enterprise clients pay a fixed amount per verification API call (e.g., ₹2 per verification). Simple and transparent, but creates price sensitivity that discourages high-volume usage. (2) Subscription tiers — monthly fee for a volume bucket (e.g., ₹5,000/month for up to 5,000 verifications). Encourages adoption but creates overestimation risk for clients. (3) Volume discounts — per-call price decreases above thresholds. Zebi used a combination of subscription tier (minimum monthly commitment) with overage charges for usage above the tier, which was standard for enterprise API products in the Indian market.",
      "Two significant production incidents: (1) A Redis cache memory overflow — the cache grew larger than the allocated memory because we hadn't set a maxmemory policy. Redis began evicting keys using the LRU algorithm, but this eviction pattern was unpredictable. When high-value cached verifications were evicted, cache hit rate dropped suddenly, causing a spike in blockchain queries and API latency. Fix: set an explicit maxmemory policy and increased the Redis instance size. (2) A Hyperledger Fabric node connectivity issue after a network configuration change — the API started returning errors for all cache-miss requests. We hadn't built a circuit breaker — the API kept retrying failed blockchain queries until all threads were blocked. Fix: implemented exponential backoff and a circuit breaker.",
      "Three architectural changes: (1) Read replicas for the blockchain node — the verification API was querying the same Hyperledger Fabric node that was processing new document writes. Separating read queries (verifications) from write queries (new document registrations) onto dedicated read replicas would have improved both verification latency and document registration reliability. (2) Circuit breaker from day one — the production incident taught me this the hard way. (3) Event-driven cache invalidation — instead of a webhook that calls a cache management service, publish document revocation events to a message queue (Kafka) and have a dedicated cache invalidation consumer process them asynchronously.",
      "Three specific ways this engineering background makes me a better PM: (1) I can read code — when engineers estimate 8 weeks for a feature, I can look at the codebase (or a diagram) and understand whether that estimate is reasonable or inflated. I've been wrong about this, which is humbling and useful. (2) I write better acceptance criteria — I know what ambiguous requirements look like from an engineering perspective. My specs have fewer clarification cycles because I've been on the receiving end of bad specs. (3) I earn engineering trust faster — engineers take my prioritisation decisions more seriously when they know I've shipped production code and understand the trade-offs they're making.",
      "On a PM resume: frame it around what you built, what problem it solved, and what outcome it enabled — not the technical implementation. 'Built verification APIs reducing response times below 2 seconds' is PM-readable: it names the artifact (APIs), the outcome (faster response), and the scale (enterprise workloads). It signals technical credibility (I can build APIs) without making me look like an engineer applying for a PM job. The key: lead with the user or business problem, let the technical detail be a supporting signal, not the headline.",
      "PMF risk of blockchain vs database: blockchain is slower, more expensive, and more complex to maintain than a traditional database. The unique value — tamper-evidence and trustlessness — only matters when the verifier doesn't trust the issuer. For most enterprise verification use cases, both parties have a contractual relationship and trust each other — a signed digital certificate from a database would suffice at lower cost and complexity. Blockchain's PMF is specifically in cross-border verification (different legal jurisdictions, no common trust anchor) and citizen-government verification (where government as the issuer and private employers as verifiers have no shared trust infrastructure).",
      "The 2-second latency improvement had three measurable business impacts: (1) Eliminated the timeout failures that were causing enterprise clients to flag authentic documents as 'unverifiable' — reducing false negatives by an estimated 15-20% of verifications in the pre-optimisation period. (2) Enabled a new use case category: synchronous verification within application flows (a recruiter verifying a degree in real-time while reviewing a candidate). Previously, the 6-second latency made this use case impractical. (3) Reduced server infrastructure cost by approximately 40% — caching reduced blockchain queries by 70%, which reduced the Hyperledger Fabric cluster compute requirements.",
      "Non-technical explanation for an enterprise buyer: 'When we register a document on our platform, we take a digital fingerprint of that document — a unique code that's specific to that exact document. We store that fingerprint on a distributed ledger — like a shared, tamper-proof record book that multiple independent parties maintain. When you want to verify the document, you take the fingerprint of the document the person has presented, and check it against our record. If the fingerprints match, the document is authentic. If someone has tampered with the document — changed a grade, altered a date — the fingerprint won't match, even if the change was a single character.' No blockchain jargon required."
    ]

    id:"z2",label:"Z2 · Migration Pipelines",
    bullet:"Developed migration pipelines validating, deduplicating, and migrating <strong>800K+ historical records</strong> to blockchain storage with zero data loss.",
    questions:[
      {q:"What were the 800K+ historical records and why did they need to be migrated?",t:"Technical",l:0},
      {q:"What does a migration pipeline do — explain it simply?",t:"Technical",l:0},
      {q:"What does 'zero data loss' mean and how did you verify it?",t:"Technical",l:0},
      {q:"Walk me through the full migration pipeline architecture step by step.",t:"Technical",l:1},
      {q:"What was the deduplication logic and why was it needed?",t:"Technical",l:1},
      {q:"What validation checks did you build into the pipeline?",t:"Technical",l:1},
      {q:"800K records — how long did the migration take to run?",t:"Analytics",l:2},
      {q:"How did you track migration progress and handle partial failures?",t:"Analytics",l:2},
      {q:"What was the reconciliation process between the source and destination systems?",t:"Analytics",l:2},

      {q:"What is idempotency and why is it critical for migration pipelines?",t:"Technical",l:4},
      {q:"What is the difference between ETL and ELT in data engineering?",t:"Technical",l:4},
      {q:"How do you handle schema evolution — what if the source and destination schemas differ?",t:"Technical",l:4},
      {q:"What is the business case for migrating historical records to blockchain vs keeping them in the original database?",t:"Business",l:5},
      {q:"Who were the stakeholders for this migration project and what were their concerns?",t:"Business",l:5},
      {q:"What regulatory or compliance requirements affected how you designed the migration?",t:"Business",l:5},

      {q:"How does this experience apply to your work as a PM today?",t:"Leadership",l:6},
      {q:"Zero data loss is a bold claim. How do you prove it definitively?",t:"Analytics",l:7},
      {q:"800K records is a small migration by enterprise standards. Why does this belong on your resume?",t:"Leadership",l:7},
