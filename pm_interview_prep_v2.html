      { q: "What are the biggest differences between being a PM at a startup vs being a PM-consultant embedded at PwC?", diff: "grill", type: "Leadership" }
    ],
    answers: [
      "NextGenAudit (NGA) is PwC's internal AI-powered audit platform designed to transform how audit teams conduct engagements. It digitises and automates the audit lifecycle — from initial scoping and risk assessment through execution and sign-off. The core problem: current audit processes are heavily manual, document-based, and inconsistent across geographies. NGA consolidates tools, standardises workflows, and embeds AI to improve efficiency, quality, and compliance consistency across PwC's global network.",
      "Azure OpenAI is Microsoft's enterprise deployment of OpenAI's models (GPT-4, etc.) hosted on Azure infrastructure with enterprise security guarantees — data doesn't leave Azure's environment, no training on client data, and compliance with SOC2, GDPR, and other enterprise standards. For PwC handling confidential client financial data, standard OpenAI's cloud service is not compliant. Azure OpenAI provides the same AI capabilities within a compliant, air-gapped-style enterprise boundary.",
      "Inherent risk assessment is the process of evaluating the risk that a material misstatement exists in a financial statement account or disclosure, before considering any internal controls. Auditors assess: the nature of the account (complexity, subjectivity), industry factors (volatility, regulatory environment), and entity factors (management integrity, business model). Higher inherent risk means more audit work is required. AI helps by synthesising information across the engagement to produce a structured risk rating recommendation.",
      "Scoping in audit means determining which accounts and disclosures are 'in scope' — significant enough to require audit procedures. The auditor looks at a trial balance (list of all accounts with balances), identifies which accounts are material to the financial statements, assesses the risks associated with those accounts, and determines what audit evidence is needed. Scoping decisions shape the entire audit engagement — under-scoping misses risks, over-scoping wastes resources.",
      "I was the Product Owner for the Scoping and Inherent Risk Assessment value stream. My specific work: taking feature-level requirements (defined by senior stakeholders and architects) and breaking them down into Product Backlog Items with clear acceptance criteria, user stories, and definition of done. I ran sprint planning, backlog refinement, and UAT coordination for this stream. I didn't define the product strategy — that sat above me — but I owned the delivery execution for my stream.",
      "AI assists account significance classification by: pulling trial balance data and mapping accounts to prior year classifications, analysing account balances relative to materiality thresholds, and synthesising qualitative information from planning documents to flag accounts with elevated risk characteristics. The AI produces a recommendation (Significant, Not Significant but Material, Not Significant) with a reasoning summary. The auditor reviews and either accepts or overrides. Key principle: AI recommends, auditor decides.",
      "Audit data is among the most sensitive corporate information — it contains client financial data, risk assessments, and potential findings that could move markets. Using AI in this context requires: data residency guarantees (client data stays in the same geography as the client's audit), no model training on client data, audit trail of all AI recommendations and human overrides, and compliance with ISQM (International Standard on Quality Management) and local regulatory requirements.",
      "For AI in compliance contexts, accuracy validation means: precision and recall testing against historical audit decisions (does the AI classify accounts the same way experienced auditors would?), false negative analysis (does the AI ever recommend 'not significant' for accounts that were material?), and expert review panels — senior audit partners review a sample of AI recommendations for calibration. The acceptance bar is not 'AI is right every time' but 'AI recommendations, reviewed by a human, produce better outcomes than human alone.'",
      "A PBI (Product Backlog Item) is a discrete unit of work that can be completed in a sprint. Feature-to-PBI breakdown process: take the feature, identify the smallest independently testable slice of functionality, write a user story ('As an auditor, I want to see account significance recommendations so that I can review and confirm them without manual calculation'), add acceptance criteria (specific, testable conditions for 'done'), estimate complexity, and sequence based on dependencies. I wrote approximately 200 PBIs across my value stream.",
      "Global rollout across 149 countries requires: multi-language support (at minimum UI translation, at best AI responses in local language), compliance with local audit standards (ISA globally, AICPA for US, local variants for specific jurisdictions), data residency configuration (EU data must stay in EU Azure regions), role-based access reflecting different country regulatory requirements, and a localisation framework so territory-specific content can be managed without engineering involvement.",
      "For probabilistic AI outputs in compliance, acceptance criteria must specify: the confidence threshold below which the AI should flag uncertainty rather than recommend, the mandatory human review step before any AI recommendation is actioned, the audit trail requirement (log every AI recommendation, every override, and the reasoning), and the edge case handling (what happens when the AI cannot produce a recommendation). You cannot write acceptance criteria like 'AI is 100% accurate' — you write criteria for the human-AI interaction quality.",
      "Hallucination in audit AI means the model generates a plausible-sounding but incorrect risk assessment or account classification. Mitigation: retrieval-augmented generation (RAG) architecture — the AI can only cite information that exists in the engagement's actual documents, reducing confabulation. Human-in-the-loop mandatory for all significant decisions. Explicit uncertainty communication — the AI must display confidence levels and source citations. And a 'red team' process where audit quality partners specifically try to find cases where the AI produces plausible but wrong recommendations.",
      "Trust-building with auditors required three things: transparency (auditors can see exactly what data the AI used to produce each recommendation and click through to the source), overrideability (the AI never makes a final decision — every recommendation requires auditor confirmation), and accuracy validation (showing partners the back-testing results: AI recommendations matched experienced auditor decisions in 87% of cases in our validation set). The framing was always 'AI as a junior team member who does the first pass analysis' not 'AI replaces auditor judgment.'",
      "Azure OpenAI is a large language model service — it processes and generates natural language text, interprets complex documents, and produces structured outputs from unstructured data. Azure AI Document Intelligence is a specialised service for document parsing — extracting structured data from forms, tables, and PDFs with high accuracy. In audit: Document Intelligence would extract trial balance data from a client-uploaded PDF; OpenAI would then analyse that structured data to produce risk assessments and recommendations. They work in combination.",
      "Quality measurement before launch: offline evaluation against a golden dataset of 50 historical audit engagements where we know the correct scoping decisions. Measure precision (of accounts AI flagged as significant, what % actually were?), recall (of actually significant accounts, what % did AI catch?), and auditor override rate in UAT (high override rates indicate the AI isn't calibrated to auditor judgment). We target a recall rate above 95% for significant account identification — missing a significant account is more dangerous than over-flagging one.",
      "Honest framing: I don't claim outcomes the platform hasn't delivered yet. I frame it as scope, complexity, and AI domain ownership. The truthful signals: the work is real (Azure OpenAI integration, global scale), my contribution is real (PBI ownership, acceptance criteria, UAT coordination), and the AI technology context is legitimate. On a resume, pre-launch work should be framed as 'spearheading' or 'building' not 'delivered' or 'improved by X%'. The interviewer will ask about it and I give exactly this honest answer.",
      "Biggest ethics concern: automation bias — auditors increasingly rubber-stamp AI recommendations rather than exercising independent judgment. If the AI is wrong and the auditor doesn't scrutinise, you get an audit failure. This is more dangerous than no AI at all, because it gives a false confidence that work was done. The product response: make override as easy as acceptance (no extra friction to disagree with AI), require explicit auditor commentary when accepting high-risk recommendations, and track override rates — declining override rates might indicate over-reliance.",
      "I'd consider: who is the primary beneficiary and what is the risk profile. 30% efficiency gain frees auditor time for higher-value work — quantifiable, immediate, high confidence. 10% quality improvement might prevent a missed misstatement — unquantifiable benefit unless you can model the cost of an audit failure. In most cases I'd prioritise quality improvement in a regulated context where a quality failure has catastrophic consequences (regulatory action, liability) vs an efficiency gain that has bounded value. But I'd also ask: can we deliver efficiency first to build platform trust, then layer quality features?",
      "The override workflow is critical and must be designed carefully: the auditor sees the AI recommendation with reasoning, they can accept (one click) or override (requires selecting a reason from a structured list plus a free-text comment). Override reasons are logged, reviewed by the engagement partner, and fed back to the AI calibration process. The key design principle: override must never feel like challenging the machine — it must feel like exercising professional judgment, which is exactly what it is.",
      "I can't speak to competitor platforms specifically as that information is internal to those firms. What I can say: PwC's differentiator for NGA is the integration of AI across the full audit lifecycle, not just point solutions. Most firm-specific tools address one phase (documentation, or risk assessment, or quality review). NGA's ambition is an end-to-end connected platform where insights from planning inform execution and execution informs next year's planning. The network effect of connected audit data across engagements is the long-term moat.",
      "ISA (International Standards on Auditing) are issued by the IAASB and govern audits in most countries globally. AICPA auditing standards (GAAS) govern US audits. Both cover similar ground — risk assessment, evidence requirements, documentation standards — but with specific procedural differences. NGA must support both because PwC audits clients in US (AICPA) and internationally (ISA). This means the scoping workflow has conditional logic: the same risk assessment step has different documentation requirements and terminology depending on the applicable standard.",
      "Model drift in a live compliance AI system: the model's recommendations become less accurate over time as accounting standards change, new risk patterns emerge, or the underlying data distribution shifts. Mitigation: establish a baseline accuracy benchmark at launch, monitor override rate as a proxy metric (rising override rate suggests the model is drifting from auditor judgment), quarterly re-validation against recent audit outcomes, and a formal model review process whenever a major standard change occurs (e.g., new IFRS 17 standard).",
      "Professional liability for audit failure remains with the auditor and the audit firm — AI is a tool, not a licensed professional. The audit partner who signs the opinion is legally responsible regardless of what tools were used. This is clear in current professional standards. The risk AI creates: it may be used as a defence ('the AI said it was low risk') which regulators are unlikely to accept. The product must make clear through UX and documentation that AI recommendations are inputs to professional judgment, not substitutes for it.",
      "Effective AI recommendation UX: show the recommendation prominently with a confidence indicator (High/Medium/Low), immediately below show the 3-5 key factors that drove the recommendation with links to source evidence, provide an 'Accept' button and an 'Override' button at equal visual weight, make the override flow require only 2 steps (reason category + comment), and show an aggregate view of how many other auditors on similar engagements accepted vs overrode this type of recommendation. Social proof from peer auditors increases acceptance of accurate recommendations.",
      "Startup PM: you define the strategy, own the roadmap, make final prioritisation calls, work with a small committed team, have high ambiguity and high ownership. Consulting-embedded PM: you execute someone else's strategy, work within an enterprise change management process, have multiple stakeholders above you in the hierarchy, and your 'team' includes client stakeholders who have other priorities. The consulting model required stronger influence-without-authority skills — I had to build credibility through data and relationships rather than org chart position. The startup model requires more strategic judgment but less stakeholder navigation."
    ]

    answers: [
      "BNPL (Buy Now Pay Later) lets consumers make purchases and pay in instalments, typically 0% interest for short tenors. ePayLater specifically offers working capital credit to small businesses and B2B buyers — not consumer BNPL. Their model: businesses can purchase inventory on credit, pay within 15-30 days, with credit limits set by a proprietary risk model. The product sits at the intersection of fintech credit and B2B commerce.",
      "The three funnels: merchant checkout (business buyer on a merchant's platform), ePayLater's own app checkout, and a white-label checkout embedded in partner platforms. Key finding: the merchant checkout had 34% higher drop-off at the credit approval step vs the app checkout. Root cause: in merchant checkout, credit approval happened synchronously during checkout — 8-12 second wait created abandonment. App checkout pre-approved the limit, so checkout was instantaneous.",
      "The 5 metrics: 30-day delinquency rate (% of loans with payment overdue by 30+ days), NPA rate (non-performing assets — loans overdue 90+ days), Days Sales Outstanding (average days from invoice to payment), utilisation rate (credit limit used vs limit granted — high utilisation can indicate stress), and vintage analysis by cohort (repayment performance of loans originated in the same week/month). Together these gave a health dashboard of the loan book.",
      "Key findings from 12 interviews: users found the credit limit setting process opaque — they didn't understand why their limit was ₹50K not ₹1L. Repayment was the most anxious part of the experience — users feared missing payment due to unclear notification timing. And trust was the biggest adoption barrier — small business owners were uncomfortable sharing GST and bank data with a startup they'd never heard of. All three insights influenced the repayment flow prioritisation.",
      "Data source was ePayLater's PostgreSQL transaction database. I wrote SQL queries to calculate each metric, then visualised in Metabase (a BI tool). The dashboard refreshed daily. Key technical challenge: vintage analysis required a self-join on the loans table to compare cohort performance at equivalent time points. I learned this pattern from the data team and implemented it independently by week 3 of the internship.",
      "Credit risk model predicts the probability of default — will this borrower repay? It uses historical repayment data, financial signals, and behavioural signals as features. A recommendation model predicts preference — will this user like this product? Both use supervised learning but with very different outcome variables and error cost asymmetry. In credit risk, a false negative (approving a defaulter) costs real money; in recommendation, a false negative (not recommending something the user would like) just costs an engagement opportunity.",
      "Three gaps: limit transparency (users didn't understand the factors behind their credit limit), repayment scheduling (users wanted to set autopay but the feature was buried 3 levels deep in settings), and KYC friction (document upload required physical bank statements — users wanted a net banking integration for automated statement fetch). The repayment scheduling finding directly influenced the product team to prioritise the autopay surface redesign.",
      "Regular payment checkout: user selects payment method → enters card/UPI details → confirms. BNPL checkout: user selects BNPL → system checks credit eligibility in real-time → if approved, order is placed and credit is extended → user sees a repayment schedule. The key difference: BNPL checkout requires a credit decision in the flow, which adds latency and a conditional branch (approved vs declined). Designing for the declined path gracefully (offer alternatives, explain why, provide upgrade path) is as important as the approved path.",
      "Repayment prioritisation means: when a borrower has multiple outstanding invoices, which gets repaid first? BNPL platforms typically apply FIFO (oldest invoice first) to minimise ageing. But from a risk perspective, you want to ensure the highest-risk accounts prioritise repayment. The product decision: show users a repayment queue that defaults to FIFO but allows reordering, with AI recommendations on which invoices to prioritise based on their supplier relationship value.",
      "BNPL loan book health: delinquency rate by vintage (newer vintages should perform similarly to or better than older ones — deteriorating newer vintages signal underwriting model degradation), NPA coverage ratio (provisions held against NPAs — a regulatory requirement), credit utilisation distribution (most borrowers using 60-80% of limit is healthy; everyone maxed out signals stress), and repeat utilisation rate (borrowers using BNPL across multiple purchase cycles — indicates product-market fit and manageable credit behaviour).",
      "RBI (Reserve Bank of India) has been tightening BNPL regulation. Key frameworks: BNPL providers must be registered as NBFCs (Non-Banking Financial Companies) or partner with one. First Loss Default Guarantee (FLDG) arrangements between BNPL platforms and bank partners were restricted in 2022. KYC requirements apply to all credit products. The regulatory trend is toward treating BNPL like any other lending product — which increases compliance burden but also increases consumer protection.",
      "The tension: a frictionless checkout that maximises conversions will approve borderline borrowers who have higher default risk. A friction-heavy checkout with rigorous checks protects the loan book but kills conversion. The balance: use a soft credit check pre-approval (no hard inquiry, faster, less friction) to approve high-confidence borrowers instantly, route medium-confidence borrowers through a lightweight verification step, and decline only clear high-risk profiles. This preserves conversion for 80% of users while managing risk on the 20% who need more scrutiny.",
      "Hard credit check: a formal inquiry that appears on the borrower's credit report, can temporarily lower their credit score, and requires explicit consent. Used for significant credit decisions. Soft credit check: an inquiry that doesn't affect the borrower's score, can be done without explicit consent in some jurisdictions, used for pre-qualification and eligibility checks. Best practice for BNPL: soft check during initial eligibility assessment, hard check only when a credit limit increase is requested or a large transaction is initiated.",
      "BNPL for thin-file users (no credit history): use alternative data signals — GST filing regularity, UPI transaction frequency and volume, business vintage (how long the business has been operating), and digital payment history. Start with a small credit limit (₹5,000-10,000), monitor repayment behaviour for 90 days, then use that repayment history to build a proprietary credit score. The product design principle: give users a way to earn trust rather than requiring pre-existing trust.",
      "Responsible lending in product design means: surfacing the total cost of credit clearly before commitment (not buried in T&Cs), defaulting to the most conservative repayment option, sending payment reminders through multiple channels proactively, making the exit path (repay and close) as easy as the entry path (apply and draw), and designing against patterns that encourage over-borrowing (don't gamify limit increases as achievements). My view: product teams in fintech have a direct responsibility to design against debt traps, especially for small business borrowers who may not be financially sophisticated."
    ]

  {
    id: "zebi",
    label: "Zebi",
    title: "Software Engineering · Blockchain · APIs",
    context: "3.5 years at Zebi Data — built verification APIs, migration pipelines, optimised throughput 12×, developed shared infrastructure, and onboarded 5M+ verifications.",
    questions: [
      { q: "What did Zebi Data do and what was your role?", diff: "basic", type: "Product" },
      { q: "What is a verification API and what problem does it solve?", diff: "basic", type: "Technical" },
      { q: "What does 'reducing API response time below 2 seconds' mean practically for users?", diff: "basic", type: "Technical" },
      { q: "What is Redis and why did you use it for caching?", diff: "mid", type: "Technical" },
      { q: "What is blockchain and why is it useful for document verification?", diff: "mid", type: "Technical" },
      { q: "What does 12× throughput improvement mean and why does it matter?", diff: "mid", type: "Technical" },
      { q: "What is a data migration pipeline and what are the risks?", diff: "mid", type: "Technical" },
      { q: "How did you ensure zero data loss during the 800K record migration?", diff: "hard", type: "Technical" },
      { q: "What is asynchronous processing and how does it improve throughput?", diff: "hard", type: "Technical" },
      { q: "How does your engineering background make you a better PM?", diff: "hard", type: "Leadership" },
      { q: "What is the difference between latency and throughput? How do you optimise for each?", diff: "hard", type: "Technical" },
      { q: "You went from software engineer to PM. What was the hardest thing to unlearn?", diff: "grill", type: "Leadership" },
      { q: "If you were PM for Zebi's verification product, what would you have built differently?", diff: "grill", type: "Product" },
      { q: "How do you communicate technical complexity to non-technical stakeholders?", diff: "grill", type: "Leadership" },
      { q: "What's the product-market fit risk of blockchain verification vs traditional database verification?", diff: "grill", type: "Business" }
    ],
    answers: [
      "Zebi Data built a blockchain-based platform for government and enterprise document verification. Primary use case: verifying the authenticity of educational certificates, identity documents, and government records. The problem: document fraud is pervasive — fake degrees, forged certificates. Zebi's solution: store a cryptographic hash of authentic documents on blockchain, allowing any verifier to check authenticity without accessing the original document. I joined as a software engineer and grew to senior engineer, building the API and data infrastructure layers.",
      "A verification API allows an external system (employer, university, government body) to programmatically check whether a document is authentic. Request: send a document hash or ID. Response: authentic/not authentic, issuing institution, date of issue, and any relevant metadata. The business value: instead of manually calling a university to verify a degree (takes days), an employer's HR system can verify instantly via API call. This was the core product — we sold API access to enterprises and government bodies.",
      "Below 2 seconds means the API responds within 2 seconds of receiving a request — fast enough that a user waiting for verification doesn't experience a perceptible delay. Before optimisation, response times were 4-8 seconds for complex queries involving multiple blockchain lookups. At 4-8 seconds, enterprise systems would often timeout and mark the verification as failed. Below 2 seconds eliminated timeouts and made integration into real-time workflows (like instant background checks) viable.",
      "Redis is an in-memory data store used for caching frequently accessed data. In our context: verification requests for the same document hash would hit the blockchain ledger each time — slow and expensive. By caching the verification result in Redis with a 24-hour TTL, subsequent requests for the same document hash returned in under 50ms instead of 2+ seconds. The trade-off: cached results might be stale if a document was invalidated, which we addressed by setting appropriate TTLs and building a cache invalidation webhook.",
      "Blockchain is a distributed ledger where data is stored in cryptographically linked blocks across multiple nodes — making it tamper-evident. If you store a document's hash on blockchain, any subsequent alteration to the original document changes its hash, which won't match the stored value. This makes blockchain ideal for document verification: the verification is trustless (doesn't require trusting any single authority) and tamper-proof. The trade-off vs traditional database: slower writes, higher infrastructure cost, but much higher trust guarantees.",
      "Before: the platform processed 1,500 blockchain events per second — sufficient for early scale. After: 19,000 events/second — a 12× improvement. This mattered because government contracts required processing millions of verifications in batch windows (end of academic year, mass hiring seasons). At 1,500 events/second, a 5 million record batch would take 55 minutes. At 19,000/second, the same batch completes in under 5 minutes — making real-time bulk verification viable.",
      "A migration pipeline moves data from one system or format to another systematically. Our migration: historical government records (800K+ documents) existed in a legacy SQL database and needed to be migrated to the blockchain verification system. Risks: data corruption during transformation, duplicate records from partial runs, loss of records if the pipeline fails mid-way. We mitigated with: idempotent design (running the pipeline twice produces the same result), reconciliation counts at each stage, and a rollback checkpoint every 50K records.",
      "Zero data loss assurance: pre-migration record count in source (800,247 records). Post-migration verification count on blockchain (must match exactly). Row-level checksum comparison — we computed a hash of key fields for each record and verified the hash matched after migration. Any record where hash didn't match was flagged for manual review. We also ran a random 5% sample spot-check comparing source and destination record fields. Migration completed with 100% record integrity on first run.",
      "Synchronous processing: each verification request waits in a queue, is processed one by one, and the client waits for the response. Throughput limited by how fast each request completes. Asynchronous processing: requests are queued and processed in parallel across multiple worker threads/processes. A client submits a request and gets a job ID, then polls for or receives a webhook with the result. This allows 10x-50x more concurrent requests. Our throughput improvement came from converting batch verification from synchronous to async multi-threaded processing.",
      "Three specific ways: first, I can read code and understand technical trade-offs without needing a translator — when engineers say 'this will take 3 weeks because we need to refactor the data model', I understand what that means and can challenge or accept the estimate intelligently. Second, I write much better acceptance criteria — I know what ambiguous requirements look like from an engineering perspective and I write specs that eliminate ambiguity upfront. Third, I earn engineering trust faster — engineers take my prioritisation decisions more seriously when they know I've shipped production code.",
      "Latency is the time taken for a single request-response cycle — the speed of one operation. Throughput is the number of operations completed per unit of time — the volume capacity. They're related but optimised differently. To reduce latency: caching, database query optimisation, reducing network hops, CDN for static assets. To improve throughput: horizontal scaling (more servers), async processing, connection pooling, batch processing. The nuance: sometimes improving throughput increases latency per request (batching delays individual responses). The right balance depends on use case — real-time verification needs low latency; batch document processing needs high throughput.",
      "The hardest thing to unlearn: the instinct to solve problems by building. As an engineer, when you see a problem, you build a solution. As a PM, often the right answer is: don't build this, change the process, or build something much simpler. The second hardest: letting go of implementation details. I spent the first 6 months of my PM career suggesting architectural approaches in PRDs — which was overstepping and slowed engineering down. Learning to specify the 'what' and 'why' and trust engineers on the 'how' was the key mindset shift.",
      "If I were PM for Zebi's verification product, I would have: built a self-service API portal (documentation, sandbox, API key management) so enterprises could onboard without sales involvement — the current enterprise sales model was too slow. Invested in a consumer-facing verification tool — a QR code or URL that any person could use to verify their own document — which would drive organic adoption and network effects. And built a webhook-based event system so enterprise clients could build real-time verification into their workflows without polling.",
      "My approach: start with the 'so what' for their role. To a sales leader: 'Our verification API reduces your enterprise client's hiring time by 3 days — that's the value proposition.' To a CFO: 'Infrastructure costs increased 15% because we added redundancy — it reduced downtime by 40% which costs ₹X per incident avoided.' The principle: translate technical facts into outcomes that matter to the audience's priorities. Never lead with the technical detail — lead with the business implication, then offer the technical detail as supporting evidence if they want it.",
      "The PMF risk of blockchain verification vs traditional database: blockchain is slower, more expensive, and more complex to maintain than a traditional database. The unique value — tamper-evidence and trustlessness — only matters when the verifier doesn't trust the issuer. For most enterprise use cases, both parties trust each other and a signed digital certificate from a database would suffice. Blockchain's PMF is specifically in cross-border verification (different legal jurisdictions, no common trust anchor) and government-to-government verification. For corporate HR verification within India, a government-signed digital certificate might have been a simpler and faster product."
    ]
  },
  {
    id: "general_pm",
    label: "General PM",
    title: "General Product Management Concepts",
    context: "Cross-cutting PM questions covering strategy, prioritisation, stakeholder management, metrics, and leadership — not tied to a specific bullet.",
    questions: [
      { q: "Walk me through how you prioritise a product backlog.", diff: "basic", type: "Product" },
      { q: "What is a PRD and what does a good one contain?", diff: "basic", type: "Product" },
      { q: "What is the difference between output, outcome, and impact?", diff: "basic", type: "Product" },
      { q: "How do you handle a situation where engineering says a feature will take 8 weeks but the business wants it in 2?", diff: "mid", type: "Leadership" },
      { q: "What metrics would you define for a new e-commerce feature at launch?", diff: "mid", type: "Analytics" },
      { q: "How do you decide when to build vs buy vs partner?", diff: "mid", type: "Product" },
      { q: "What is North Star metric and how do you choose one?", diff: "mid", type: "Analytics" },
      { q: "How do you manage stakeholders who have conflicting priorities?", diff: "hard", type: "Leadership" },
      { q: "What is the difference between discovery and delivery in product management?", diff: "hard", type: "Product" },
      { q: "How do you measure product-market fit?", diff: "hard", type: "Analytics" },
      { q: "Describe a time you made a wrong product decision. What happened and what did you learn?", diff: "hard", type: "Leadership" },
      { q: "How do you know when to kill a feature?", diff: "hard", type: "Product" },
      { q: "What's your framework for writing user stories?", diff: "grill", type: "Product" },
      { q: "How do you balance technical debt vs new feature development?", diff: "grill", type: "Product" },
      { q: "If your DAU drops 20% suddenly, walk me through how you diagnose it.", diff: "grill", type: "Analytics" },
      { q: "What makes a great PM vs a good PM?", diff: "grill", type: "Leadership" },
      { q: "How do you approach building a product roadmap from scratch?", diff: "grill", type: "Product" },
      { q: "What is jobs-to-be-done theory and how do you apply it?", diff: "grill", type: "Product" },
      { q: "How do you run a sprint retrospective that actually leads to change?", diff: "grill", type: "Leadership" },
      { q: "What's the most important thing you've learned about product management from your consulting experience?", diff: "grill", type: "Leadership" },
      { q: "How would you design an OKR system for an e-commerce product team?", diff: "grill", type: "Product" },
      { q: "What's the difference between qualitative and quantitative user research? When do you use each?", diff: "grill", type: "Product" },
      { q: "How do you write acceptance criteria that engineers actually find useful?", diff: "grill", type: "Product" },
      { q: "What's your approach to competitive analysis?", diff: "grill", type: "Business" },
      { q: "Where do you see product management evolving in the next 5 years given AI?", diff: "grill", type: "Business" }
    ],
    answers: [
      "My prioritisation framework: start with the strategic objective for the quarter (what does the business need to be true in 90 days?), then evaluate each backlog item on three dimensions — impact on that objective, confidence in the estimate, and effort required. I use a modified ICE score: Impact × Confidence ÷ Effort. Items with high impact, high confidence, and low effort go first. I then layer in dependencies (what must be done before this can be done?) and risk (what has the highest uncertainty that we should learn about early?). The output is a sequenced backlog, not just a ranked list.",
      "A good PRD contains: the problem statement (what user problem are we solving and why it matters now), success metrics (how we'll know it worked), user personas and jobs to be done, functional requirements (what the system must do — not how), edge cases and error states, non-functional requirements (performance, security, accessibility), out of scope (what we're deliberately not building), and open questions. What a bad PRD contains: solution descriptions, UI wireframes embedded in requirements, and implementation details. The PRD should be solution-agnostic — it defines the problem space, not the solution.",
      "Output is what you build — 'we launched a new checkout flow.' Outcome is the behaviour change that results — 'checkout completion rate improved 18%.' Impact is the business result — 'revenue increased 12% attributable to checkout improvement.' The PM's job is to own outcomes and impact, not just outputs. A team that ships a feature (output) that nobody uses has delivered output without outcome. The prioritisation question should always be: 'what outcome does this output produce?' not 'how fast can we ship this feature?'",
      "First, understand the constraint — is 8 weeks the engineering estimate for the full scope, or for the scope as defined? Often, a scope conversation can move the timeline. Second, ask what the minimum viable version looks like that could be done in 2-3 weeks — often 80% of the value can be delivered in 20% of the time. Third, if the business deadline is genuinely fixed, have a transparent conversation about trade-offs: what does reduced scope look like, what are the quality risks of compression, and who makes the call on acceptable risk. Fourth, escalate the trade-off to the right decision-maker — the PM's role is to surface the choice clearly, not to silently absorb the pressure.",
      "For a new e-commerce feature at launch: primary metric (the one number that proves it worked — for a checkout feature, that's checkout completion rate), guardrail metrics (things we must not break — page load time, payment success rate, error rate), leading indicators (early signals before the primary metric moves — add-to-cart rate, feature engagement rate), and qualitative signal (NPS or CSAT from users who interacted with the feature). I define all of these before launch so there's no ambiguity about what success looks like.",
      "Build when: the capability is core to your competitive differentiation, you need deep customisation, or the build cost over 3 years is lower than licensing cost. Buy when: the capability is not differentiated, a mature solution exists, or speed to market is critical. Partner when: you need access to data or distribution that you can't build, or the capability requires ongoing expertise you don't have. The mistake most companies make: building when they should buy because of the 'not invented here' bias. My test: 'Would we be proud to say this is proprietary technology?' If not, buy.",
      "A North Star metric is the single metric that best represents the value your product delivers to users and, by extension, to the business. Choice criteria: it must be user-centric (reflects value delivered), it must be leading (moves before revenue moves), and it must be actionable (your team can directly influence it). For Le Marche, I'd argue North Star is 'weekly orders per active user' — it captures both retention (active) and value delivery (orders). Revenue is an outcome of this, not the North Star itself. Vanity metrics like total users fail because they don't reflect value.",
      "My approach: start by understanding each stakeholder's underlying interest, not their stated position. Two stakeholders who both say 'this is our top priority' often want different things — the sales leader wants a feature to close a specific deal, the growth leader wants the feature to improve retention metrics. Once I understand underlying interests, I look for the synthesis: is there a version of this feature that addresses both? If not, I make the trade-off explicit and escalate to the leader who has authority over both. I never let stakeholder conflicts resolve through ambiguity — they always need an explicit decision.",
      "Discovery is the process of identifying what to build and validating that it's worth building — customer interviews, problem validation, solution exploration, prototype testing. Delivery is the process of building and shipping what's been decided — sprint planning, engineering execution, QA, release. The distinction matters because they require different skills, different mindsets, and different processes. A common PM failure: conflating the two and doing 'discovery' by writing a PRD based on gut feel, then calling it validated. Real discovery happens before the PRD, not during it.",
      "PMF indicators: retention curve flattening (users who stay after week 4 continue to stay — the retention curve has an asymptote above zero), organic growth (users referring others without incentives), high engagement among retained users (not just returning but using the product frequently), and qualitative signal (users expressing disappointment at the thought of losing the product — Sean Ellis's 'very disappointed' threshold of 40%). For B2B: contract renewal rate and net revenue retention above 100% are the clearest PMF signals.",
      "During the Le Marche engagement I pushed to launch a loyalty points feature in the festive season. My reasoning: higher basket sizes during festive, rewards would incentivise repeat purchase. Engineering built it in 3 weeks. Launch: 4% of users enrolled in 30 days, negligible impact on repeat purchase rate. Post-mortem: Le Marche's customer base was deal-seeking, not loyalty-motivated. A discount was more compelling than points accumulation. I had validated the feature with users who said 'yes' to a leading question rather than testing actual behaviour. The lesson: stated preference is not revealed preference. Test with real incentives before building.",
      "Kill a feature when: usage is below 5% of active users after 90 days of promotion, the maintenance cost exceeds the value it generates, it creates confusion for the majority of users who don't use it, or a better solution now exists. The hard part is killing features that have a vocal minority of power users — I weight silent majority behaviour over vocal minority feedback. Before killing, I give a 60-day warning to heavy users, understand their use case, and ensure an alternative path exists. Then kill cleanly — half-dead features are more costly than absent ones.",
      "My user story format: As a [specific user type], I want to [accomplish specific goal] so that [the value or benefit]. Three rules: the user type must be specific (not 'user' — 'first-time buyer who hasn't completed KYC'), the goal must be an action not a feature ('view my pending orders' not 'have a pending orders tab'), and the 'so that' must describe real value not technical function. Then I add acceptance criteria as a separate section — testable conditions written as 'Given/When/Then' scenarios that tell engineering exactly what done looks like.",
      "Technical debt accumulates when engineering shortcuts are taken to ship faster. My framework: treat tech debt like financial debt — it has an interest rate (the ongoing cost of working around it) and a principal (the effort to fix it). High-interest debt (debt that slows down every sprint) gets prioritised like a P1 feature. Low-interest debt (debt in rarely-touched code) can wait. I allocate 20% of sprint capacity to tech debt by default, with flexibility to increase when debt is blocking velocity. The business case: 20% to tech debt now prevents needing to slow down by 40% in 6 months.",
      "DAU drops 20% — diagnostic process: first, check for data pipeline issues (is the drop real or a tracking failure?). If real: segment by platform (iOS, Android, web) to isolate the surface. Check deployment history — was anything released in the past 48 hours? If yes, correlate release timing with drop. Check by user segment — new vs returning, geo, device. Check funnel stage — did the drop happen at login, onboarding, or engagement? External factors — check if a competitor launched, if there was negative press, or if a social platform algorithm change affected traffic. Within 2 hours I expect to have a hypothesis. Within 24 hours, a root cause. The biggest mistake: jumping to conclusions before segmenting.",
      "A good PM delivers outcomes. A great PM changes how the team thinks about the problem. Tactically: great PMs write PRDs that make engineering feel smart, not constrained. They give engineers the problem, not the solution. Strategically: great PMs kill features as confidently as they create them — they're as good at saying no as yes. The distinguishing trait I've seen: great PMs are comfortable with ambiguity and can make a 70% confidence decision in 30 minutes, rather than seeking 95% confidence and making a decision in 2 weeks when the opportunity is gone.",
      "Roadmap from scratch: start with company strategy (where is the business going in 12-18 months?), then customer problems (what are the top 5 problems your target users face?), then competitive landscape (what are competitors solving that you're not?), then internal capabilities (what can you build with current resources?). Plot the intersection: problems worth solving that align with company strategy and build on your capabilities. Sequence by: dependency order, confidence in solution, time-sensitivity of opportunity. A roadmap is a communication tool, not a commitment — it should be updated quarterly.",
      "Jobs-to-be-done: people 'hire' products to do a job in their life — to make progress toward a goal or overcome a struggle. The insight: the job is stable even when products change. People hired a horse-drawn carriage for the job of 'transport me faster than walking.' They fired it and hired a car when a better solution appeared. Application: when doing user research, instead of asking 'what features do you want?' ask 'what were you trying to do before you found our product?' and 'what job is our product doing for you that you couldn't do before?' This reveals the true competition and the true value proposition.",
      "A retrospective that actually changes things: make it a structured 30-minute session (not a general venting session), use a specific format — What went well, What didn't, What we'll do differently. Limit 'what we'll do differently' to 3 items maximum — more than 3 is unactionable. Each item must have a specific owner and a specific definition of done. At the start of the next retro, review the 3 commitments from last retro first. The most common retro failure: generating a list of improvements that never get tracked and repeat as complaints every sprint.",
      "The most important lesson from consulting: decisions happen at the intersection of data and relationships, not data alone. I could walk into any client meeting with perfect analysis, but if I hadn't built trust with the key stakeholders beforehand, the analysis would be rejected on political grounds. The consulting discipline of 'no surprises' — pre-aligning key stakeholders before the formal presentation — is something I apply in every product context. Don't present your roadmap for the first time in the roadmap review. Have 1:1s with every key stakeholder beforehand so the formal meeting is a confirmation, not a negotiation.",
      "OKR system for an e-commerce product team: Objective should be qualitative and inspiring — 'Make checkout the most trusted experience in D2C grocery.' Key Results should be specific and measurable — 'Improve checkout completion rate from 33% to 42%', 'Reduce payment failure rate from 14% to 8%', 'Achieve NPS of 40 from checkout users'. Rules: 3 KRs per objective maximum, KRs are outcomes not outputs (not 'launch guest checkout' but 'improve completion rate by X%'), set at 70% confidence (if you're 100% confident you'll hit it, it's not ambitious enough), and review monthly not just quarterly.",
      "Qualitative research: interviews, usability tests, diary studies — surfaces the 'why' behind behaviour, generates hypotheses, uncovers unarticulated needs. Use when: you don't know what the problem is, a metric moved unexpectedly and you need to understand why, or you're designing a novel experience with no precedent. Quantitative research: surveys, analytics, A/B tests — validates hypotheses at scale, tells you 'what' is happening. Use when: you have a hypothesis and need to validate it, or you need to understand the prevalence of a problem. Rule of thumb: use qualitative to generate hypotheses, quantitative to validate them.",
      "Acceptance criteria that engineers find useful: written as Given/When/Then scenarios (Given a user who hasn't logged in, When they reach checkout, Then they see a guest checkout option). Specific enough that a QA engineer can write a test case directly from the criteria. Includes edge cases (What happens if the API is slow? What if the user is on a 2G connection?). Includes error states (What does the user see when payment fails?). Does NOT include UI specifications — that's the designer's job. Does NOT include implementation approach — that's the engineer's job. My litmus test: if I hand this to QA and they can write test cases without asking me questions, it's good acceptance criteria.",
      "My competitive analysis framework: direct competitors (same product, same market), indirect competitors (different product, same job-to-be-done), and future competitors (companies that could enter your market with their existing capabilities). For each: features/capabilities (what do they offer?), pricing and positioning, user perception (app store reviews, Twitter, G2), recent moves (funding, launches, acquisitions), and what their roadmap signals. I run a full analysis quarterly and a lightweight pulse check monthly. The output: a competitive positioning map and a 'watch list' of 2-3 moves I'd make if I were them.",
      "AI will split PM into two archetypes: the 'product engineer' who builds AI-powered features and understands the technology deeply enough to define AI product specs (training data, model behaviour, edge cases), and the 'customer advocate' who focuses entirely on user research and outcome definition, with AI handling the analytical and documentation work. The PM skills that become more valuable: problem framing, stakeholder communication, ethical judgment. The PM skills AI will automate: requirement documentation, competitive analysis, metric tracking. My view: PMs who embrace AI as a tool and focus on the judgment and relationship skills that AI can't replicate will be the highest-value PMs in 10 years."
    ]
  },

    answers: [
      "Start with the through-line: 'I started as a software engineer at Zebi Data, building blockchain verification systems for 3.5 years. That gave me a deep technical foundation. I then did my MBA at MDI Gurgaon, where I interned at ePayLater as a PM intern. Since then I've been at PwC India as an embedded Product Manager across 6+ D2C and enterprise engagements — including Le Marche, Satya Retail, and PwC's own AI-powered audit platform. I'm now looking for an in-house PM role where I can go deeper in one domain and build for a single product over a longer horizon.' Keep it to 90 seconds. End with why this specific role.",
      "In consulting, I've had the privilege of working across 6+ products in 2 years — breadth of exposure that's hard to get otherwise. What I've learned is that I'm most energised when I can go deep: understand a user deeply, learn the domain thoroughly, and see the long-term impact of decisions I made 12 months ago. Consulting engagements end at 6-12 months — right when I start to really understand the product and user. In-house, I get to close that loop. I also want to build a team, a culture, and a product that outlasts my tenure — which consulting doesn't enable.",
      "My genuine strength is being comfortable in the space between technical and business. I can talk to engineers as a peer — I've written production code and understand the trade-offs they're making. And I can talk to business stakeholders in their language — ROI, customer impact, market positioning. Most PMs are strong on one side. The 3.5 years of engineering at Zebi before my MBA means I've lived both, not just observed them. The practical outcome: I write better specs, have fewer engineering conflicts, and earn cross-functional trust faster.",
      "During the Le Marche engagement, the business stakeholder wanted to add a referral programme to the festive sprint — 4 weeks before Diwali. My position: referral programmes require careful design (incentive structure, fraud prevention, attribution) and rushing it would produce a broken experience that damaged trust. The stakeholder argued urgency — festive is when acquisition cost is lowest. I proposed a middle path: launch a simple 'share this product' feature (no complex incentive engine) in 1 week, and build the full referral programme for the next season. We aligned on this. The simple version launched, drove some sharing, and we built the proper version with 3 months of lead time.",
      "The loyalty points feature at Le Marche — covered earlier. The key learning beyond what I mentioned: I didn't define success metrics before launching. I had a vague expectation of 'increased repeat purchase' but no specific threshold that would tell me it worked or failed. When engagement was low, I didn't have a clean decision framework for whether to iterate or kill it. Now I define explicit success criteria with time windows before every feature launch: 'If X metric doesn't reach Y by Z date, we kill or significantly pivot.'",
      "At Satya Retail, we needed to decide whether to build an offline-first order capture capability. I had partial data: we knew field agents had poor connectivity based on qualitative feedback (field rides), but I didn't have quantitative data on what % of working time was offline. Engineering estimated 6 weeks for offline-first vs 2 weeks for a basic online-only app. Decision under uncertainty: I applied the regret minimisation framework. If connectivity turns out to be fine and we built offline-first unnecessarily, we've spent 4 extra weeks but have a more robust product. If connectivity is a serious problem and we didn't build offline-first, we ship something field agents can't use. The downside of not building was much worse than the downside of building unnecessarily. We built offline-first.",
      "Learning system: I block 45 minutes every Friday for structured reading — currently rotating between product blogs (Lenny's Newsletter, Reforge content), industry reports relevant to my domain, and one book per month. I follow 15-20 PMs on LinkedIn whose thinking I respect and engage with their writing critically. I also practice by building — my current side project (automated job finder) is as much a learning exercise as a portfolio piece. The Upraised PM Fellowship was a deliberate investment in structured PM skill building. And I debrief every significant decision I make — what I decided, what happened, what I'd do differently.",
      "My ideal engineering relationship: engineers are treated as problem-solving partners, not ticket-executing resources. I write PRDs that give context — what problem we're solving, why now, what success looks like — so engineers can bring their own solutions. I never specify implementation in a PRD. I'm available for questions during the sprint without being in every meeting. I advocate for engineering priorities (tech debt, tooling, architectural decisions) in business conversations. And I celebrate engineering achievements publicly — too many PMs take credit for what engineering built.",
      "At PwC, I had no direct authority over any engineer — they all reported to the client's engineering organisation. To influence the roadmap, I built credibility through three things: being right about priorities (showing that items I pushed delivered measurable outcomes), being a multiplier for engineering (writing specs that reduced clarification cycles by 40%), and advocating for their interests in business conversations (getting scope reduced when timelines were compressed). The moment I stopped being seen as the person who assigns work and started being seen as the person who removes obstacles and gives engineering the context to do their best work — that's when influence without authority became real.",
      "My manager would say I sometimes move too fast to execution and don't spend enough time ensuring all stakeholders are aligned before I start building. In the Le Marche engagement, I moved a feature into development before getting explicit sign-off from the operations stakeholder — who then flagged issues during UAT that required rework. I've since built a 'sign-off checklist' into my pre-sprint process: every feature above a medium complexity level requires explicit written confirmation from all impacted stakeholders before engineering begins. It adds 3-5 days to the process but eliminates late-stage rework.",
      "My approach: be honest about the conflict and investigate the discrepancy. Data tells you what happened; intuition is a hypothesis about why. When they conflict, it usually means the data is measuring the wrong thing or the intuition is pattern-matching to a context that doesn't apply here. Example: my intuition said users would prefer recommendations based on brand affinity (buy more from the same brand). Data showed co-purchase affinity (buy products others bought together) significantly outperformed. My intuition was wrong because Le Marche users were variety-seeking, not brand-loyal — a contextual difference I hadn't accounted for. The data was right.",
      "The corporate stakeholder at Satya Retail wanted to add a customer chat feature to the retailer app. The feature request was reasonable — retailers wanted to message their field agent directly. My position: this competes with WhatsApp (which retailers and agents already use), adds significant engineering complexity (real-time messaging, push notifications, read receipts), and addresses a workflow problem that's better solved by improving order status visibility (why do retailers message agents? Mostly to check on their order). I presented this analysis, proposed order status as the alternative, and asked for 6 weeks to see if it moved the contact rate metric. It did — by 40%. The chat feature was deprioritised.",
      "My answer to this question: I bring two things most domain-specific PMs don't have together. First, genuine technical credibility — I've shipped production code, not just worked with engineers. When I say 'this API latency threshold is achievable in 6 weeks', I can back it up. Second, cross-domain pattern recognition — having worked across 6+ products in 2 years, I see patterns that a PM who's been in one domain for 3 years might miss. The specific playbook for festive demand planning that I built at Le Marche came from seeing 3 different clients face the same problem in 3 different ways. Domain experience can be learned in 3-6 months. Engineering credibility and cross-domain pattern recognition take years.",
      "The hardest problem was the festive UAT crunch at Le Marche — 4 features to release simultaneously in 72 hours before Diwali. Engineering found a critical bug in the corporate gifting checkout 36 hours before go-live. The choice: delay the gifting feature (miss the festive window entirely) or ship with a workaround that required manual ops intervention for corporate orders. I chose the workaround — ops team handled 23 corporate orders manually over 3 days while engineering fixed the root cause. The business result was preserved, the engineering quality issue was addressed post-festive. The learning: have a pre-defined decision framework for go/no-go that you've aligned on with stakeholders before crunch time, not during it.",
      "In 3 years: I want to be leading a product team — either as a senior PM managing other PMs, or as a Head of Product in a growth-stage company. The specific outcome I'm targeting: shipping a product that has genuine market impact in the e-commerce or AI space, and building a team culture where PMs feel they can take calculated risks and learn from failures without career consequences. I'm also actively building in public through a side project (automated job finder) which I see as both a portfolio piece and a forcing function to keep my 0-to-1 product skills sharp.",
      "My approach to ambiguity: distinguish between the ambiguity that should be resolved (unclear requirements where the right answer exists and needs to be found) and ambiguity that should be embraced (strategic uncertainty where experimentation is the right response). For the first type: I document the question, identify who has the answer, and resolve it within 24 hours rather than letting it block the sprint. For the second type: I define the smallest experiment that would give us the signal we need, timeframe it (2 weeks), and proceed. The biggest mistake in ambiguity is analysis paralysis — spending 4 weeks figuring out the perfect answer when 2 weeks of experimentation would have given you a better answer.",
      "Immediate: don't panic or start reassigning their work. First hour: identify what they were working on, what's in-flight, and what's blocked. Document everything they knew that isn't written down — within 24 hours while context is fresh. Next 24 hours: triage in-flight work by criticality. Some items can wait, some need to be redistributed, some need to be de-scoped. Communicate to stakeholders what impact this has on the timeline — early and honestly. Medium term: identify the knowledge gap and fill it (hire, contract, redistribute). The worst outcome: trying to pretend it didn't happen and committing to the same timeline without the same capacity.",
      "At PwC, the NextGenAudit platform required alignment across 3 value streams (Scoping, Planning, Execution) each with their own PM and engineering team, plus the architecture team, the audit quality team (subject matter experts), and senior leadership. No single person had authority over all of them. I built alignment by: mapping out dependencies between streams explicitly and running a bi-weekly cross-stream sync that I organised and facilitated. I also created a single source of truth for decisions — a shared decisions log that anyone could view. The practice that made the biggest difference: pre-aligning key stakeholders 1:1 before cross-team meetings so the formal meeting was a confirmation, not a negotiation.",
      "My contrarian view: the best PM skill is knowing when not to do discovery. Discovery is important but it's been fetishised to the point where teams run 8 weeks of user interviews before writing a single line of code — for problems that are obvious. If users tell you checkout is confusing and your funnel shows 40% drop-off at payment, you don't need 3 months of discovery. You need to ship a guest checkout, measure it, and iterate. Over-discovery is a form of procrastination. The skill is calibrating how much discovery the uncertainty level of this specific problem requires — which varies from 'just ship it' to 'we need 6 weeks of ethnographic research'.",
      "My approach when pushed to ship faster than is responsible: make the risk explicit and visible, not abstract. Not 'we might have quality issues' but 'specifically, if we ship without this security review, we have a known XSS vulnerability in the checkout that could expose user payment data — here's the risk documentation, who is comfortable signing off on that?' Most pressure-to-ship-fast comes from leaders who don't have full visibility of the specific risk. When the risk is specific and documented, most reasonable leaders choose to absorb the timeline hit. If they still insist after full risk disclosure, get written confirmation of the decision — both to protect yourself and to make the accountability clear.",
      "During the Le Marche festive sprint, our QA engineer fell sick 2 weeks before Diwali with 6 features in UAT. Outside my PM remit, I ran UAT for 3 of the 6 features myself — wrote test cases, executed them, documented bugs. Not glamorous work, but it was what the team needed. Outcome: we shipped all 6 features on time with zero critical post-release defects. The broader point: a PM who is willing to do whatever the team needs — even non-PM work — in a crunch builds a different kind of team trust than one who stays strictly in their lane.",
      "What motivates me: the moment a user does something they couldn't do before because of something I built. That's the elemental thing. More specifically: I'm energised by problems that sit at the intersection of user behaviour change and business model — checkout optimisation is interesting not just because it's a UX problem but because it directly connects to revenue. And I'm motivated by the compounding nature of product work — a good decision made today shows up in metrics 90 days from now, and that feedback loop, when you've designed it well, is deeply satisfying.",
      "If I could change one thing: the way PMs communicate uncertainty. Most PMs present roadmaps as if they're commitments — Q3 we will ship X, Q4 we will ship Y. This creates a culture where changing the roadmap feels like failure, and so PMs hold to bad decisions longer than they should. I'd normalise communicating roadmaps as probability distributions — 'we're 90% confident we'll ship checkout improvements in Q3, 70% confident we'll ship the loyalty programme, and we have a hypothesis about gifting that we'll validate in Q2 to decide if it belongs in Q4.' This is honest and actually improves stakeholder trust over time because you're never surprising anyone.",
      "Approach to difficult feedback: be specific, immediate, and private. 'That presentation was disorganised' is not feedback — 'the stakeholder meeting yesterday ran 20 minutes over because we hadn't defined the decision we needed to make going in — next time, let's align on the decision question before the meeting' is feedback. I use the SBI model: Situation (where/when), Behaviour (what specifically happened), Impact (what was the consequence). I deliver it within 24-48 hours while context is fresh. And I always end with: 'what support do you need from me to do this differently?' — making it a conversation, not a verdict.",
      "The questions I'd ask: What does success look like for this PM in the first 90 days? What's the biggest product challenge the team is facing right now that this role will help solve? How does this team make prioritisation decisions — who has final say when there's disagreement? What's the engineering team's current velocity and what's the biggest bottleneck to shipping faster? And: what's something about how product is done here that you're trying to change? The last question is the most revealing — it tells you where the real problems are and whether leadership is self-aware about them."

let currentSection = 0;
let openCards = new Set();
let activeFilter = 'all';

function init() {
  renderNav();
  renderSection(0);
}

function renderNav() {
  const nav = document.getElementById('sectionNav');
  nav.innerHTML = sections.map((s, i) =>
    `<button class="nav-btn ${i === 0 ? 'active' : ''}" onclick="selectSection(${i})">${s.label}</button>`
  ).join('');
}

function selectSection(idx) {
  currentSection = idx;
  openCards.clear();
  activeFilter = 'all';
  document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  renderSection(idx);
}

function renderSection(idx) {
  const s = sections[idx];
  const area = document.getElementById('questionArea');
  const total = s.questions.length;

  let html = `
    <div class="section-header">
      <div class="section-context">${s.context}</div>
      <div class="section-title">${s.title}</div>
      <div class="section-meta">// ${total} questions · click to reveal ideal answer</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-info"><span>Answered</span><span id="progText">0 / ${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="filter-bar">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active" onclick="setFilter('all')">All</button>
      <button class="filter-btn" onclick="setFilter('basic')">Basic</button>
      <button class="filter-btn" onclick="setFilter('mid')">Mid</button>
      <button class="filter-btn" onclick="setFilter('hard')">Hard</button>
      <button class="filter-btn" onclick="setFilter('grill')">🔥 Grill</button>
      <button class="filter-btn" onclick="setFilter('Product')">Product</button>
      <button class="filter-btn" onclick="setFilter('Technical')">Technical</button>
      <button class="filter-btn" onclick="setFilter('Analytics')">Analytics</button>
      <button class="filter-btn" onclick="setFilter('Business')">Business</button>
      <button class="filter-btn" onclick="setFilter('Leadership')">Leadership</button>
    </div>
    <div class="toolbar">
      <span class="toolbar-left" id="visibleCount">${total} questions visible</span>
      <button class="expand-all" onclick="toggleAll()">Expand All</button>
    </div>
  `;

  const diffMap = { basic: 'Basic', mid: 'Mid', hard: 'Hard', grill: '🔥 Grill' };
  const diffClass = { basic: 'diff-basic', mid: 'diff-mid', hard: 'diff-hard', grill: 'diff-grill' };

  s.questions.forEach((q, i) => {
    const answer = s.answers[i] || 'Answer coming soon.';
    html += `
      <div class="q-card" id="qcard-${i}" data-diff="${q.diff}" data-type="${q.type}">
        <div class="q-header" onclick="toggleCard(${i})">
          <span class="q-num">Q${String(i+1).padStart(2,'0')}</span>
          <span class="q-text">${q.q}</span>
          <div class="q-right">
            <span class="type-tag">${q.type}</span>
            <span class="diff-tag ${diffClass[q.diff]}">${diffMap[q.diff]}</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="answer-panel">
          <div class="answer-inner">
            <div class="answer-label">Ideal Answer</div>
            <div class="answer-text">${formatAnswer(answer)}</div>
          </div>
        </div>
      </div>
    `;
  });

  area.innerHTML = html;
}

function formatAnswer(text) {
  return text.replace(/(\d+%|\d+×|\d+K\+|\d+M\+|\₹[\d,]+)/g, '<span class="metric">$1</span>');
}

function toggleCard(i) {
  const card = document.getElementById(`qcard-${i}`);
  if (!card || card.classList.contains('hidden')) return;
  card.classList.toggle('open');
  if (card.classList.contains('open')) openCards.add(i); else openCards.delete(i);
  updateProgress();
}

function toggleAll() {
  const s = sections[currentSection];
  const visible = s.questions.map((_, i) => i).filter(i => {
    const card = document.getElementById(`qcard-${i}`);
    return card && !card.classList.contains('hidden');
  });
  const allOpen = visible.every(i => openCards.has(i));
  visible.forEach(i => {
    const card = document.getElementById(`qcard-${i}`);
    if (allOpen) { card.classList.remove('open'); openCards.delete(i); }
    else { card.classList.add('open'); openCards.add(i); }
  });
  updateProgress();
}

function setFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const s = sections[currentSection];
  let visible = 0;
  s.questions.forEach((q, i) => {
    const card = document.getElementById(`qcard-${i}`);
    if (!card) return;
    const show = filter === 'all' || q.diff === filter || q.type === filter;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.getElementById('visibleCount').textContent = `${visible} questions visible`;
  updateProgress();
}

function updateProgress() {
  const s = sections[currentSection];
  const total = s.questions.length;
  const answered = openCards.size;
  const pct = (answered / total) * 100;
  const fill = document.getElementById('progFill');
  const text = document.getElementById('progText');
  if (fill) fill.style.width = pct + '%';
  if (text) text.textContent = `${answered} / ${total}`;
}

init();
</script>
</body>
</html>
